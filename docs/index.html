  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "65d749fe-443e-48d7-96c9-25600a3b8456",
        safari_web_id: "web.onesignal.auto.65d749fe-443e-48d7-96c9-25600a3b8456",
        notifyButton: {
          enable: true,
        },
        allowLocalhostAsSecureOrigin: true,
      });
      try {
        OneSignal.Notifications.requestPermission();
      } catch(e) {}
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=1.0.2').catch(e => console.log('SW Load:', e));
      });
    }

    function triggerLockScreenNotification(title, message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        const options = {
          body: message,
          icon: './insta.png',
          badge: './insta.png',
          vibrate: [300, 100, 300, 100, 300],
          tag: 'randevu-onayi-' + Date.now(),
          renotify: true,
          requireInteraction: true
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, options);
          }).catch(() => {
            try { new Notification(title, options); } catch(e) {}
          });
        } else {
          try { new Notification(title, options); } catch(e) {}
        }
      }
    }

    function requestLockScreenNotifications() {
      if ('OneSignalDeferred' in window) {
        OneSignalDeferred.push(function(OneSignal) {
          OneSignal.Notifications.requestPermission();
        });
      }
      if (!('Notification' in window)) {
        alert('Tarayıcınız sistem/kilitli ekran bildirimlerini desteklemiyor.');
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          triggerLockScreenNotification('EZO STİLE VIP 💇‍♂️', '🔔 Kilitli ekran bildirimleri aktif! Randevu onayınız kilitli ekrana gelecektir.');
          alert('✅ Kilitli ekran bildirimleri başarıyla aktif edildi!');
        } else {
          alert('⚠️ Bildirim izni reddedildi. Cihazınızın bildirim ayarlarını kontrol ediniz.');
        }
      });
    }
  </script>

    /* VIP EZO STİLE DESIGN SYSTEM & CSS TOKENS */
    :root {
      --bg-dark: #070c1a;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* Utility Classes */
    .container { width: 100%; max-width: 920px; margin: 0 auto; padding: 16px; }
    .gold-gradient-text { background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-btn { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); color: #070c1a; font-weight: 800; border: none; padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25); text-decoration: none; font-size: 12px; }
    .gold-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4); }
    .gold-btn:active { transform: translateY(0); }
    
    .card { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .input-field { width: 100%; background: #070c1a; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: var(--gold-primary); }

    /* Logo sharp styling */
    .logo-box { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid var(--gold-primary); box-shadow: 0 0 15px rgba(245,158,11,0.3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .logo-box img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); }

    /* Header & Footer */
    header { background: rgba(7, 12, 26, 0.95); border-bottom: 1px solid var(--border-color); padding: 14px 20px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .header-content { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    footer { margin-top: auto; border-top: 1px solid var(--border-color); padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; background: #040711; }

    /* Animations */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* Badges */
    .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .badge-approved { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rejected { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Slot Grid */
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-top: 12px; }
    .slot-btn { padding: 10px 4px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); background: #070c1a; color: var(--text-main); cursor: pointer; text-align: center; transition: all 0.15s; }
    .slot-btn.selected { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; border-color: #f59e0b; transform: scale(1.05); }
    .slot-btn.disabled, .slot-btn.past { opacity: 0.3; cursor: not-allowed !important; text-decoration: line-through; border-color: #1e293b; background: rgba(15, 23, 42, 0.4); pointer-events: none; }
    .slot-btn.blocked { background: rgba(244, 63, 94, 0.2); color: #fb7185; border-color: rgba(244, 63, 94, 0.4); }
    .slot-btn.opened { background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: rgba(16, 185, 129, 0.4); }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-content { background: #0f172a; border: 1px solid var(--gold-primary); border-radius: 24px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

    /* Notification Toast */
    .notif-box { background: rgba(15, 23, 42, 0.95); border: 1px solid var(--gold-primary); padding: 12px 16px; border-radius: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }

    /* 3-Step Wizard Navigation */
    .step-wizard { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-color); border-radius: 18px; padding: 6px; margin-bottom: 20px; gap: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .step-item { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 6px; border-radius: 14px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: all 0.25s ease; text-align: center; user-select: none; }
    .step-item.active { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); color: #070c1a; font-weight: 900; box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
    .step-item.completed { color: #34d399; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.1); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
    .step-item.active .step-num { background: #070c1a; color: var(--gold-primary); font-weight: 900; }
</head>

    // --- DEFAULT SERVICES LIST ---
    const DEFAULT_SERVICES = [
      { id: '1', name: 'Saç Kesimi & Yıkama & Şekillendirme', duration: '30 dk', price: 250 },
      { id: '2', name: 'Sakal Tıraşı & Buharlı İtalyan Bakımı', duration: '20 dk', price: 150 },

      { id: '6', name: 'Saç Boyama / Beyaz Kapatma', duration: '45 dk', price: 350 }
    ];

    function getLocalDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getInitialBookingDate() {
      const now = new Date();
      const todayStr = getLocalDateStr(now);
      const dayOfWeek = now.getDay();
      const savedSched = JSON.parse(localStorage.getItem('gc_weekly_schedule') || 'null');
      const sched = (savedSched && savedSched[dayOfWeek]) ? savedSched[dayOfWeek] : { isOpen: true, start: '09:00', end: '21:00' };
      const closingHour = parseInt((sched.end || '21:00').split(':')[0], 10);
      
      // If current hour is past closing hour or shop closed today, auto select tomorrow!
      if (!sched.isOpen || now.getHours() >= closingHour) {
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        return getLocalDateStr(tomorrow);
      }
      return todayStr;
    }

    // --- APP STATE ---
    let state = {
      language: localStorage.getItem('gc_lang') || 'tr',
      role: 'customer', // 'customer' | 'admin' | 'manager'
      currentUser: JSON.parse(localStorage.getItem('gc_user') || 'null'),
      smsCode: null,
      adminTab: 'requests', // 'weeklySchedule' | 'slotLocking' | 'servicesAdmin' | 'requests'
      requestsSubTab: 'pending', // 'pending' | 'approved' | 'rejected'
      services: JSON.parse(localStorage.getItem('gc_services') || JSON.stringify(DEFAULT_SERVICES)),
      bookingStep: 1,
      selectedServiceId: '1',
      selectedDate: getInitialBookingDate(),
      selectedTime: '',
      weeklySchedule: JSON.parse(localStorage.getItem('gc_weekly_schedule') || JSON.stringify({
        1: { isOpen: true, start: '12:00', end: '22:00' },
        2: { isOpen: true, start: '09:00', end: '21:00' },
        3: { isOpen: true, start: '09:00', end: '21:00' },
        4: { isOpen: true, start: '09:00', end: '21:00' },
        5: { isOpen: true, start: '09:00', end: '23:00' },
        6: { isOpen: true, start: '09:00', end: '23:00' },
        0: { isOpen: true, start: '10:00', end: '20:00' }
      })),
      dateSlotOverrides: JSON.parse(localStorage.getItem('gc_date_slot_overrides') || '[]'),
      notifications: JSON.parse(localStorage.getItem('gc_notifications') || '[]'),
      appointments: JSON.parse(localStorage.getItem('gc_appointments') || JSON.stringify([
        { id: '101', customerName: 'Ahmet Yılmaz', customerPhone: '05321112233', serviceName: 'Saç Kesimi & Yıkama & Şekillendirme', date: new Date().toISOString().split('T')[0], time: '14:00', price: 250, status: 'approved' }
      ]))
    };

    function t(key) {
      const dict = TRANSLATIONS[state.language] || TRANSLATIONS.tr;
      return dict[key] || TRANSLATIONS.tr[key] || key;
    }

    function getServiceName(svc) {
      if (svc.id && TRANSLATIONS[state.language]?.services?.[svc.id]) {
        return TRANSLATIONS[state.language].services[svc.id];
      }
      return svc.name;
    }

    function setLanguage(lang) {
      state.language = lang;
      localStorage.setItem('gc_lang', lang);
      document.getElementById('btn-staff-login').innerText = t('staffLogin');
      document.getElementById('btn-back-customer').innerText = t('backToCustomer');
      renderApp();
    }

    function switchRole(role) {
      state.role = role;
      document.getElementById('footer-staff-link').style.display = role === 'customer' ? 'block' : 'none';
      document.getElementById('footer-back-link').style.display = role !== 'customer' ? 'block' : 'none';
      const badge = document.getElementById('role-badge');
      if (role !== 'customer') {
        badge.innerText = role === 'admin' ? '👑 Admin' : '🛠️ Yönetici';
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
      renderApp();
    }

    // --- 1 HOUR REMINDER CHECK ---
    function check1HourReminder(apt) {
      if (apt.status !== 'approved') return false;
      try {
        const [y, m, d] = apt.date.split('-').map(Number);
        const [hh, mm] = apt.time.split(':').map(Number);
        const aptDateObj = new Date(y, m - 1, d, hh, mm);
        const now = new Date();
        const diffMin = (aptDateObj.getTime() - now.getTime()) / (1000 * 60);
        return diffMin > 0 && diffMin <= 60;
      } catch {
        return false;
      }
    }

    // --- MAIN RENDERER WITH DEFENSIVE ERROR BOUNDARY ---
    function renderApp() {
      try {
        const main = document.getElementById('main-app');
        if (!main) return;
        
        const subTitleEl = document.getElementById('header-subtitle');
        if (subTitleEl) subTitleEl.innerText = t('subtitle');
        const staffLoginEl = document.getElementById('btn-staff-login');
        if (staffLoginEl) staffLoginEl.innerText = t('staffLogin');
        const backCustEl = document.getElementById('btn-back-customer');
        if (backCustEl) backCustEl.innerText = t('backToCustomer');
        
        if (state.role === 'customer') {
          renderCustomerView(main);
        } else {
          renderAdminView(main);
        }
      } catch (err) {
        console.error('EZO STILE RenderApp Error:', err);
        const main = document.getElementById('main-app');
        if (main) {
          main.innerHTML = `
            <div class="card" style="text-align: center; padding: 32px 20px; max-width: 480px; margin: 40px auto; border-color: var(--gold-primary);">
              <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px; background: #000; border: 2px solid var(--gold-primary); overflow: hidden;">

              <button onclick="localStorage.clear(); location.reload();" class="gold-btn" style="width: 100%; padding: 16px; font-size: 14px; font-weight: 900;">
                🔄 Önbelleği Temizle & Başlat
              </button>
            </div>
          `;
        }
      }
    }

    // --- CUSTOMER VIEW ---
    function renderCustomerView(container) {
      // IF CUSTOMER IS NOT REGISTERED YET: SHOW ONLY REGISTRATION CARD
      if (!state.currentUser) {
        container.innerHTML = `
          <div class="card" style="border-color: var(--gold-primary); max-width: 480px; margin: 40px auto; text-align: center; padding: 30px;">
            <div style="width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 20px; background: #000; border: 2px solid var(--gold-primary); overflow: hidden;">
              <img src="./insta.png" onerror="this.onerror=null; this.src='insta.png';" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.02);" alt="Logo">
            </div>
            <h2 style="font-size: 20px; font-weight: 900; color: var(--gold-primary); margin-bottom: 8px;">${t('custLoginTitle')}</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">${t('custLoginDesc')}</p>
            
            <form onsubmit="handleCustomerRegister(event)" style="display: flex; flex-direction: column; gap: 12px;">
              <input id="reg-name" required type="text" placeholder="Adınız Soyadınız" class="input-field" style="padding: 14px; font-size: 14px;">
              <input id="reg-phone" required type="tel" placeholder="Telefon Numaranız (05XX...)" class="input-field" style="padding: 14px; font-size: 14px;">
              <button type="submit" class="gold-btn" style="padding: 16px; font-size: 14px; margin-top: 4px;">
                ${t('custLoginBtn')}
              </button>
            </form>
          </div>
        `;
        return;
      }

      // REGISTERED CUSTOMER VIEW: SHOW 3-STEP WIZARD & MY APPOINTMENTS
      state.bookingStep = (state.bookingStep === 1 || state.bookingStep === 2 || state.bookingStep === 3) ? state.bookingStep : 1;
      if (!state.selectedDate) state.selectedDate = getInitialBookingDate();

      const currentServices = (Array.isArray(state.services) && state.services.length > 0) ? state.services : DEFAULT_SERVICES;
      const currentAppointments = Array.isArray(state.appointments) ? state.appointments : [];
      const currentNotifications = Array.isArray(state.notifications) ? state.notifications : [];
      const currentOverrides = Array.isArray(state.dateSlotOverrides) ? state.dateSlotOverrides : [];

      const phone = state.currentUser ? state.currentUser.phone : '';
      const myApts = currentAppointments.filter(a => a && a.customerPhone === phone);
      const myNotifs = currentNotifications.filter(n => n && n.phone === phone);
      const upcoming1h = myApts.find(check1HourReminder);

      // Check weekly schedule for selected date
      const parts = (state.selectedDate || getLocalDateStr()).split('-');
      const dObj = new Date(parseInt(parts[0] || '2026'), parseInt(parts[1] || '8') - 1, parseInt(parts[2] || '15'));
      const dayOfWeek = isNaN(dObj.getDay()) ? 1 : dObj.getDay();
      const sched = (state.weeklySchedule && state.weeklySchedule[dayOfWeek]) ? state.weeklySchedule[dayOfWeek] : { isOpen: true, start: '09:00', end: '21:00' };

      // Generate time slots
      const startHour = parseInt((sched.start || '09:00').split(':')[0]);
      const endHour = parseInt((sched.end || '21:00').split(':')[0]);
      const availableSlots = [];
      if (sched.isOpen) {
        for (let h = startHour; h <= endHour; h++) {
          const hh = h.toString().padStart(2, '0');
          availableSlots.push(`${hh}:00`);
          if (h !== endHour) availableSlots.push(`${hh}:30`);
        }
      }

      currentOverrides.filter(o => o && o.date === state.selectedDate && o.status === 'opened').forEach(o => {
        if (!availableSlots.includes(o.time)) availableSlots.push(o.time);
      });
      availableSlots.sort();

      const now = new Date();
      const todayStr = getLocalDateStr(now);
      const tomorrowObj = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const tomorrowStr = getLocalDateStr(tomorrowObj);
      const isToday = state.selectedDate === todayStr;
      const isPastDate = state.selectedDate < todayStr;
      const currentHour = now.getHours();
      const currentMin = now.getMinutes();

      let allPastForToday = false;
      if (isToday && availableSlots.length > 0) {
        allPastForToday = availableSlots.every(time => {
          const [sHour, sMin] = time.split(':').map(Number);
          return sHour < currentHour || (sHour === currentHour && sMin <= currentMin);
        });
      }

      const activeSelectedService = currentServices.find(s => s && s.id === state.selectedServiceId) || currentServices[0] || DEFAULT_SERVICES[0];

      let html = '';

      // LOGGED IN USER BAR
      html += `
        <div class="card" style="padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">

            <div style="font-size: 13px; font-weight: 800; color: #fff;">👤 ${state.currentUser.name}</div>

          <div style="display: flex; gap: 8px; align-items: center;">

                📋 Randevularım (${myApts.length})

          </div>
        </div>
      `;

      // NOTIFICATIONS TOASTS
      if (myNotifs.length > 0) {
        html += `<div style="margin-bottom: 12px;">`;
        myNotifs.forEach(n => {
          html += `
            <div class="notif-box">
              <div>
                <strong style="color: var(--gold-primary);">${n.title}</strong>
                <div style="color: #fff; margin-top: 2px;">${n.message}</div>
              </div>
              <button onclick="dismissNotif('${n.id}')" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 800;">✕</button>
            </div>
          `;
        });
        html += `</div>`;
      }

      // 1-HOUR REMINDER BANNER
      if (upcoming1h) {
        html += `
          <div class="reminder-banner animate-pulse" style="background: rgba(245,158,11,0.12); border: 1px solid var(--gold-primary); padding: 12px 16px; border-radius: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-weight: 900; font-size: 13px; color: #fbbf24; text-transform: uppercase;">${t('reminderTitle')}</div>
              <div style="font-size: 12px; color: #fff; margin-top: 4px;">📌 ${upcoming1h.serviceName} — ⏰ ${upcoming1h.date} ${upcoming1h.time}</div>
            </div>
            <button onclick="Notification.requestPermission()" class="gold-btn" style="padding: 8px 12px; font-size: 11px;">${t('enableNotifications')}</button>
          </div>
        `;
      }

      // 3-STEP WIZARD NAVIGATION BAR
      html += `
        <div class="step-wizard">
          <div class="step-item ${state.bookingStep === 1 ? 'active' : state.bookingStep > 1 ? 'completed' : ''}" onclick="setBookingStep(1)">
            <span class="step-num">1</span>
            <span>Hizmet Seç</span>
          </div>
          <div class="step-item ${state.bookingStep === 2 ? 'active' : state.bookingStep > 2 ? 'completed' : ''}" onclick="setBookingStep(2)">
            <span class="step-num">2</span>
            <span>Tarih & Saat</span>
          </div>
          <div class="step-item ${state.bookingStep === 3 ? 'active' : ''}" onclick="setBookingStep(3)">
            <span class="step-num">3</span>
            <span>Onayla</span>
          </div>
        </div>

      // STEP 1: SERVICE SELECTION
      if (state.bookingStep === 1) {
        html += `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h3 style="font-size: 15px; font-weight: 900; color: var(--gold-primary);">1. İstediğiniz İşlemi Seçiniz</h3>

                const isSel = activeSelectedService.id === s.id;

                  <div onclick="selectService('${s.id}')" style="padding: 16px; border-radius: 16px; border: 2px solid ${isSel ? 'var(--gold-primary)' : 'var(--border-color)'}; background: ${isSel ? 'rgba(245,158,11,0.12)' : '#070c1a'}; cursor: pointer; transition: all 0.2s ease; box-shadow: ${isSel ? '0 4px 15px rgba(245,158,11,0.2)' : 'none'};">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                      <div style="font-weight: 800; font-size: 14px; color: #fff;">${displayName}</div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                      <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">⏱️ ${s.duration}</span>
                      <span style="font-size: 15px; font-weight: 900; color: var(--gold-primary);">${s.price} TL</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <button onclick="setBookingStep(2)" class="gold-btn" style="width: 100%; padding: 16px; font-size: 15px; font-weight: 900;">
              Sonraki Adım: Tarih & Saat Seç ➔
            </button>
          </div>
        `;
      }

      // STEP 2: DATE & TIME SELECTION
      else if (state.bookingStep === 2) {
        html += `
          <div class="card">
            <!-- SELECTED SERVICE SUMMARY BAR -->
            <div style="background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 14px; padding: 12px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">

              </button>
            </div>

            <input type="date" value="${state.selectedDate}" min="${todayStr}" onchange="selectDate(this.value)" class="input-field" style="margin-bottom: 24px; padding: 12px; font-size: 14px; font-weight: 700;">

            <h3 style="font-size: 15px; font-weight: 900; color: var(--gold-primary); margin-bottom: 12px;">3. Randevu Saati Seçiniz</h3>

            ${!sched.isOpen ? `
              <div style="background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3); color: #fb7185; padding: 16px; border-radius: 16px; font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 20px;">
                ⚠️ Bu tarihte (${state.selectedDate}) salonumuz kapalıdır. Lütfen başka bir gün seçiniz.

                  const override = currentOverrides.find(b => b && b.date === state.selectedDate && b.time === time);

                    apt &&
                    apt.date === state.selectedDate && 
                    apt.time === time && 
                    apt.status !== 'rejected' && 
                    apt.status !== 'cancelled'
                  );
                  const isBlocked = (override ? override.status === 'blocked' : false) || alreadyBooked;
                  const isSelected = state.selectedTime === time;

                  let isPast = false;
                  if (isToday) {
                    const [sHour, sMin] = time.split(':').map(Number);
                    if (sHour < currentHour || (sHour === currentHour && sMin <= currentMin)) {
                      isPast = true;
                    }
                  } else if (isPastDate) {
                    isPast = true;
                  }

                  const isDisabled = isBlocked || isPast;

                  return `
                    <button onclick="selectTime('${time}')" ${isDisabled ? 'disabled' : ''} class="slot-btn ${isPast ? 'past' : ''} ${isBlocked ? 'blocked' : ''} ${isSelected ? 'selected' : ''}">

      // STEP 3: SUMMARY & FINAL CONFIRMATION
      else if (state.bookingStep === 3) {

            </div>

            <div style="display: flex; gap: 10px;">
              <button onclick="setBookingStep(2)" style="flex: 1; background: #070c1a; border: 1px solid var(--border-color); color: #fff; padding: 16px; border-radius: 14px; font-weight: 700; cursor: pointer;">
                ⬅️ Geri
              </button>
              <button onclick="submitBooking(); setBookingStep(1);" class="gold-btn" style="flex: 2; padding: 16px; font-size: 16px; font-weight: 900;">
                📅 RANDEVUYU ONAYLA
              </button>
            </div>
          </div>
        `;
      }

      // MY APPOINTMENTS SECTION
      html += `
        <div id="my-apts-section" class="card">
          <h3 style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 14px;">${t('myAppointments')} (${myApts.length})</h3>
          ${myApts.length === 0 ? `
            <p style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 20px;">Henüz verilmiş bir randevunuz bulunmamaktadır.</p>

          activeList.forEach(a => {

    // --- TRIPLE-REDUNDANT HIGH-AVAILABILITY REAL-TIME CLOUD BACKEND ENGINE ---
    const CLOUD_ENDPOINTS = [
      'https://ezostile-barber-default-rtdb.europe-west1.firebasedatabase.app/ezostile_v5.json'
    ];
    let isSyncingCloud = false;
    let lastCloudUpdateTimestamp = Number(localStorage.getItem('gc_last_cloud_ts') || 0);
    let lastLocalUpdateTimestamp = Number(localStorage.getItem('gc_last_local_ts') || 0);

    async function syncToCloud(overridePayload = null) {
      const now = Date.now();
      lastLocalUpdateTimestamp = now;
      localStorage.setItem('gc_last_local_ts', now.toString());

      const payload = overridePayload || {
        appointments: state.appointments,
        dateSlotOverrides: state.dateSlotOverrides,
        weeklySchedule: state.weeklySchedule,
        services: state.services,
        notifications: state.notifications,
        updatedAt: now
      };

      const bodyStr = JSON.stringify(payload);

      await Promise.allSettled(CLOUD_ENDPOINTS.map(url =>
        fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: bodyStr
        }).catch(() => {})
      ));
    }

    function playNotificationSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    }

    async function fetchFromCloud() {
      if (isSyncingCloud) return;
      try {
        isSyncingCloud = true;
        let latestData = null;

        for (const url of CLOUD_ENDPOINTS) {
          try {
            const res = await fetch(url, { cache: 'no-store' });
            if (res.ok) {
              const text = await res.text();
              if (text && text.trim().startsWith('{')) {
                const parsed = JSON.parse(text);
                if (parsed && parsed.updatedAt) {
                  if (!latestData || parsed.updatedAt > latestData.updatedAt) {
                    latestData = parsed;
                  }
                }
              }
            }
          } catch (e) {}
        }

        if (latestData && latestData.updatedAt) {
          // Sadece başka bir cihazdan gelen yeni veriyi kabul et
          if (latestData.updatedAt > lastCloudUpdateTimestamp && Math.abs(latestData.updatedAt - lastLocalUpdateTimestamp) > 1000) {
            
            // Check for new pending appointments for Admin audio chime & lock screen notification
            if (state.role !== 'customer' && latestData.appointments) {
              const oldPending = (state.appointments || []).filter(a => a.status === 'pending').length;
              const newPending = latestData.appointments.filter(a => a.status === 'pending').length;
              if (newPending > oldPending) {
                playNotificationSound();
                const newestApt = latestData.appointments.find(a => a.status === 'pending');
                const aptInfo = newestApt ? `${newestApt.customerName} - ${newestApt.date} ${newestApt.time}` : 'Yeni randevu';
                triggerLockScreenNotification("EZO STİLE - VIP Berber 💇‍♂️", `⚠️ Randevu onayı bekliyor! (${aptInfo})`);
              }
            }

            // Check if Customer's pending appointment was approved or rejected
            if (state.currentUser && latestData.appointments) {
              const myOldPending = (state.appointments || []).filter(a => a.customerPhone === state.currentUser.phone && a.status === 'pending');
              myOldPending.forEach(oldApt => {
                const updated = latestData.appointments.find(a => a.id === oldApt.id);
                if (updated && updated.status === 'approved') {
                  triggerLockScreenNotification("EZO STİLE - Randevu Onaylandı! ✅", `Randevunuz onaylandı: ${updated.serviceName} (${updated.date} ${updated.time})`);
                } else if (updated && updated.status === 'rejected') {
                  triggerLockScreenNotification("EZO STİLE - Randevu İptal/Red ❌", `Randevu talebiniz onaylanamadı. (${updated.date} ${updated.time})`);
                }
              });
            }

            lastCloudUpdateTimestamp = latestData.updatedAt;
            localStorage.setItem('gc_last_cloud_ts', latestData.updatedAt.toString());

            if (latestData.appointments) {
              state.appointments = latestData.appointments;
              localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));
            }
            if (latestData.dateSlotOverrides) {
              state.dateSlotOverrides = latestData.dateSlotOverrides;
              localStorage.setItem('gc_date_slot_overrides', JSON.stringify(state.dateSlotOverrides));
            }
            if (latestData.weeklySchedule) {
              state.weeklySchedule = latestData.weeklySchedule;
              localStorage.setItem('gc_weekly_schedule', JSON.stringify(state.weeklySchedule));
            }
            if (latestData.services) {
              state.services = latestData.services;
              localStorage.setItem('gc_services', JSON.stringify(state.services));
            }
            if (latestData.notifications) {
              state.notifications = latestData.notifications;
              localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));
            }

            renderApp();
          }
        } else if (lastLocalUpdateTimestamp === 0 && (!latestData || !latestData.updatedAt)) {
          // Initial seed sync if cloud is completely empty
          syncToCloud();
        }
      } catch (err) {
        // Silent catch
      } finally {
        isSyncingCloud = false;
      }
    }

    // Auto poll cloud DB every 1.5 seconds for instant multi-device sync
    fetchFromCloud();
    setInterval(fetchFromCloud, 1500);

    // Sync on tab focus or visibility change
    window.addEventListener('focus', fetchFromCloud);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) fetchFromCloud();
    });

    function isValidTurkishGsm(phone) {
      let clean = (phone || '').replace(/\D/g, '');
      if (clean.startsWith('90')) clean = clean.substring(2);
      if (clean.startsWith('0')) clean = clean.substring(1);
      
      if (clean.length !== 10 || !clean.startsWith('5')) return false;
      
      // Reject repetitive or obvious fake numbers
      if (/^(\d)\1{9}$/.test(clean)) return false;
      if (clean === '1234567890' || clean === '5454646352' || clean === '5000000000') return false;

      const prefix = parseInt(clean.substring(0, 3));
      // Valid TR & KKTC GSM prefixes: 501-509, 530-539, 540-549, 551-559, 561
      if ((prefix >= 501 && prefix <= 509) || 
          (prefix >= 530 && prefix <= 539) || 
          (prefix >= 540 && prefix <= 549) || 
          (prefix >= 551 && prefix <= 559) || 
          prefix === 561) {
        return true;
      }
      return false;
    }

            <h3 style="font-size: 16px; font-weight: 900; color: ${isApprove ? 'var(--emerald)' : 'var(--rose)'}; margin-bottom: 8px;">${title}</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">Müşteriye anında bilgi vermek ister misiniz?</p>
            
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; font-size: 11px; color: #fff; margin-bottom: 16px; text-align: left;">
              <strong>Örnek Mesaj Metni:</strong><br/>
              <em>"${msgText}"</em>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button onclick="sendCustomerWhatsApp('${apt.customerPhone}', '${msgText.replace(/'/g, "\\'")}'); closeModal();" class="gold-btn" style="background: #25D366; color: #fff; border: none; display: flex; align-items: center; justify-content: center; gap: 6px;">
                💬 WhatsApp İle Bilgi Gönder
              </button>
              <button onclick="sendCustomerSms('${apt.customerPhone}', '${msgText.replace(/'/g, "\\'")}'); closeModal();" class="gold-btn" style="background: #3b82f6; color: #fff; border: none; display: flex; align-items: center; justify-content: center; gap: 6px;">
                📱 Normal SMS İle Gönder
              </button>
              <button onclick="closeModal()" class="gold-btn" style="background: #1e293b; color: #aaa;">
                Kapat
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function adminApproveApt(id) {
      const apt = state.appointments.find(a => a.id === id);
      if (apt) {
        apt.status = 'approved';
        localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));

        const notif = {
          id: Date.now().toString(),
          phone: apt.customerPhone,
          title: '🎉 Randevunuz Onaylandı!',
          message: `EZO STİLE: ${apt.serviceName} randevunuz ${apt.date} saat ${apt.time} için ONAYLANDI.`,
          date: new Date().toLocaleTimeString()
        };
        state.notifications.unshift(notif);
        localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));

        syncToCloud();
        window.dispatchEvent(new Event('storage'));
        renderApp();
        openNotificationActionModal(apt, 'approved');
      }
    }

    function adminRejectApt(id) {
      const apt = state.appointments.find(a => a.id === id);
      if (apt) {
        apt.status = 'rejected';
        localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));

        const notif = {
          id: Date.now().toString(),
          phone: apt.customerPhone,
          title: '❌ Randevunuz İptal Edildi / Reddedildi',
          message: `EZO STİLE: ${apt.serviceName} randevunuz ${apt.date} ${apt.time} tarihi için reddedildi/iptal edildi.`,
          date: new Date().toLocaleTimeString()
        };
        state.notifications.unshift(notif);
        localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));

        syncToCloud();
        window.dispatchEvent(new Event('storage'));
        renderApp();
        openNotificationActionModal(apt, 'rejected');
      }
    }

    function dismissNotif(notifId) {
      state.notifications = state.notifications.filter(n => n.id !== notifId);
      localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));
      syncToCloud();
      renderApp();
    }

    // --- SERVICE MANAGEMENT FUNCTIONS ---
    function updateServiceField(id, field, value) {
      const svc = state.services.find(s => s.id === id);
      if (svc) {
        svc[field] = field === 'price' ? Number(value) : value;
        localStorage.setItem('gc_services', JSON.stringify(state.services));
        syncToCloud();
      }
    }

    function addNewService() {
      const name = document.getElementById('new-svc-name').value;
      const duration = document.getElementById('new-svc-dur').value || '30 dk';
      const price = Number(document.getElementById('new-svc-price').value || 200);

      if (!name) {
        alert('Lütfen hizmet adını giriniz.');
        return;
      }

      const newSvc = {
        id: Date.now().toString(),
        name,
        duration,
        price
      };

      state.services.push(newSvc);
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      alert(`✅ "${name}" hizmeti başarıyla eklendi!`);
      renderApp();
    }

    function deleteService(id) {
      if (state.services.length <= 1) {
        alert('En az bir hizmet kalmalıdır.');
        return;
      }
      state.services = state.services.filter(s => s.id !== id);
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      renderApp();
    }

    function saveServices() {
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      alert('✅ Tüm hizmet isimleri ve fiyatlar başarıyla kaydedildi!');
      renderApp();
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });

    // Storage live sync listener
    window.addEventListener('storage', () => {
      state.weeklySchedule = JSON.parse(localStorage.getItem('gc_weekly_schedule') || JSON.stringify(state.weeklySchedule));
      state.dateSlotOverrides = JSON.parse(localStorage.getItem('gc_date_slot_overrides') || '[]');
      state.services = JSON.parse(localStorage.getItem('gc_services') || JSON.stringify(state.services));
      state.appointments = JSON.parse(localStorage.getItem('gc_appointments') || '[]');
      state.notifications = JSON.parse(localStorage.getItem('gc_notifications') || '[]');
      renderApp();
    });
  </script>
</body>
</html>
