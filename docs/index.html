    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "65d749fe-443e-48d7-96c9-25600a3b8456",
        safari_web_id: "web.onesignal.auto.65d749fe-443e-48d7-96c9-25600a3b8456",
        notifyButton: {
          enable: true,
        },
        allowLocalhostAsSecureOrigin: true,
      });
      try {
        OneSignal.Notifications.requestPermission();
      } catch(e) {}
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW Load:', e));
      });
    }

    function triggerLockScreenNotification(title, message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        const options = {
          body: message,
          icon: './logo.png',
          badge: './logo.png',
          vibrate: [300, 100, 300, 100, 300],
          tag: 'randevu-onayi-' + Date.now(),
          renotify: true,
          requireInteraction: true
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, options);
          }).catch(() => {
            try { new Notification(title, options); } catch(e) {}
          });
        } else {
          try { new Notification(title, options); } catch(e) {}
        }
      }
    }

    function requestLockScreenNotifications() {
      if (typeof playNotificationSound === 'function') playNotificationSound(true);
      if ('OneSignalDeferred' in window) {
        OneSignalDeferred.push(function(OneSignal) {
          OneSignal.Notifications.requestPermission();
        });
      }
      if (!('Notification' in window)) {
        alert('Tarayıcınız sistem/kilitli ekran bildirimlerini desteklemiyor.');
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          triggerLockScreenNotification('EZO STİLE VIP 💇‍♂️', '🔔 Kilitli ekran bildirimleri ve sesli uyarılar aktif! Randevu onayınız sesli ve kilitli ekrana gelecektir.');
          alert('✅ Kilitli ekran ve sesli bildirimler başarıyla aktif edildi!');
        } else {
          alert('⚠️ Bildirim izni reddedildi. Cihazınızın bildirim ayarlarını kontrol ediniz.');
        }
      });
    }

    /* VIP EZO STİLE DESIGN SYSTEM & CSS TOKENS */
    :root {

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    /* Utility Classes */
    .container { width: 100%; max-width: 920px; margin: 0 auto; padding: 16px; }

    .gold-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4); }
    .gold-btn:active { transform: translateY(0); }
    
    .card { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .input-field { width: 100%; background: #070c1a; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: var(--gold-primary); }

    /* Logo sharp styling */
    .logo-box { width: 54px; height: 54px; border-radius: 14px; overflow: hidden; background: #070c1a; border: 2px solid var(--gold-primary); box-shadow: 0 0 15px rgba(245,158,11,0.35); flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 1px; }
    .logo-box img { width: 100%; height: 100%; object-fit: contain; }

    /* Header & Footer */
    header { background: rgba(7, 12, 26, 0.95); border-bottom: 1px solid var(--border-color); padding: 14px 20px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .header-content { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    footer { margin-top: auto; border-top: 1px solid var(--border-color); padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; background: #040711; }

    /* Animations */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* Badges */
    .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .badge-approved { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rejected { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Slot Grid */
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-top: 12px; }
    .slot-btn { padding: 10px 4px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); background: #070c1a; color: var(--text-main); cursor: pointer; text-align: center; transition: all 0.15s; }
    .slot-btn.selected { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; border-color: #f59e0b; transform: scale(1.05); }
    .slot-btn.disabled, .slot-btn.past { opacity: 0.3; cursor: not-allowed !important; text-decoration: line-through; border-color: #1e293b; background: rgba(15, 23, 42, 0.4); pointer-events: none; }
    .slot-btn.blocked { background: rgba(244, 63, 94, 0.2); color: #fb7185; border-color: rgba(244, 63, 94, 0.4); }
    .slot-btn.opened { background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: rgba(16, 185, 129, 0.4); }

    function getLocalDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getInitialBookingDate() {
      const now = new Date();
      const todayStr = getLocalDateStr(now);
      const dayOfWeek = now.getDay();
      const savedSched = JSON.parse(localStorage.getItem('gc_weekly_schedule') || 'null');
      const sched = (savedSched && savedSched[dayOfWeek]) ? savedSched[dayOfWeek] : { isOpen: true, start: '09:00', end: '21:00' };
      const closingHour = parseInt((sched.end || '21:00').split(':')[0], 10);
      
      // If current hour is past closing hour or shop closed today, auto select tomorrow!
      if (!sched.isOpen || now.getHours() >= closingHour) {
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        return getLocalDateStr(tomorrow);
      }
      return todayStr;
    }

      if (svc.id && TRANSLATIONS[state.language]?.services?.[svc.id]) {
        return TRANSLATIONS[state.language].services[svc.id];
      }
      return svc.name;
    }

    function setLanguage(lang) {
      state.language = lang;
      localStorage.setItem('gc_lang', lang);
      document.getElementById('btn-staff-login').innerText = t('staffLogin');

      renderApp();

      const badge = document.getElementById('role-badge');
      if (role !== 'customer') {
        badge.innerText = role === 'admin' ? '👑 Admin' : '🛠️ Yönetici';
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
      renderApp();
    }

    // --- 1 HOUR REMINDER CHECK ---
    function check1HourReminder(apt) {
      if (apt.status !== 'approved') return false;
      try {
        const [y, m, d] = apt.date.split('-').map(Number);
        const [hh, mm] = apt.time.split(':').map(Number);
        const aptDateObj = new Date(y, m - 1, d, hh, mm);
        const now = new Date();
        const diffMin = (aptDateObj.getTime() - now.getTime()) / (1000 * 60);
        return diffMin > 0 && diffMin <= 60;
      } catch {
        return false;
      }
    }

    function sanitizeState() {
      if (!state.adminPassword) state.adminPassword = localStorage.getItem('gc_admin_pwd') || '1405';
      if (!Array.isArray(state.managerPasswords) || state.managerPasswords.length === 0) {
        state.managerPasswords = JSON.parse(localStorage.getItem('gc_manager_pwds') || '["5555"]');
      }
      if (!Array.isArray(state.services) || state.services.length === 0) state.services = DEFAULT_SERVICES;
      if (!Array.isArray(state.appointments)) state.appointments = [];
      if (!Array.isArray(state.notifications)) state.notifications = [];
      if (!Array.isArray(state.dateSlotOverrides)) state.dateSlotOverrides = [];
      if (!state.weeklySchedule || typeof state.weeklySchedule !== 'object') {
        state.weeklySchedule = {
          1: { isOpen: true, start: '12:00', end: '22:00' },
          2: { isOpen: true, start: '09:00', end: '21:00' },
          3: { isOpen: true, start: '09:00', end: '21:00' },
          4: { isOpen: true, start: '09:00', end: '21:00' },
          5: { isOpen: true, start: '09:00', end: '23:00' },
          6: { isOpen: true, start: '09:00', end: '23:00' },
          0: { isOpen: true, start: '10:00', end: '20:00' }
        };
      }
      if (!state.selectedDate || typeof state.selectedDate !== 'string' || state.selectedDate.length < 8) {
        state.selectedDate = getInitialBookingDate();
      }
    }

    // --- MAIN RENDERER ---
    function renderApp() {
      try {
        sanitizeState();
        const main = document.getElementById('main-app');
        if (!main) return;

        const subTitle = document.getElementById('header-subtitle');
        if (subTitle) subTitle.innerText = t('subtitle');
        
        const staffBtn = document.getElementById('btn-staff-login');
        if (staffBtn) staffBtn.innerText = t('staffLogin');
        
        const backBtn = document.getElementById('btn-back-customer');
        if (backBtn) backBtn.innerText = t('backToCustomer');
        
        const langSelect = document.getElementById('lang-select');
        if (langSelect) langSelect.value = state.language;
        
        if (state.role === 'customer') {
          renderCustomerView(main);
        } else {
          renderAdminView(main);
        }
      } catch (err) {
        console.error('renderApp error:', err);
      }
    }

    // --- CUSTOMER VIEW ---
    function renderCustomerView(container) {
      // IF CUSTOMER IS NOT REGISTERED YET: SHOW ONLY REGISTRATION CARD
      if (!state.currentUser) {
        container.innerHTML = `
          <div class="card" style="border-color: var(--gold-primary); max-width: 480px; margin: 40px auto; text-align: center; padding: 30px;">
            <div style="max-width: 240px; width: 85%; margin: 0 auto 20px; text-align: center;">
              <img src="./logo.png" onerror="this.onerror=null; this.src='logo.png';" style="width: 100%; height: auto; max-height: 130px; object-fit: contain; filter: drop-shadow(0 6px 15px rgba(0,0,0,0.8));" alt="EZO STİLE Logo">
            </div>
            <h2 style="font-size: 20px; font-weight: 900; color: var(--gold-primary); margin-bottom: 8px;">${t('custLoginTitle')}</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">${t('custLoginDesc')}</p>
            
            <form onsubmit="handleCustomerRegister(event)" style="display: flex; flex-direction: column; gap: 12px;">
              <input id="reg-name" required type="text" placeholder="${t('namePlaceholder')}" class="input-field" style="padding: 14px; font-size: 14px;">
              <input id="reg-phone" required type="tel" placeholder="${t('phonePlaceholder')}" class="input-field" style="padding: 14px; font-size: 14px;">
              <button type="submit" class="gold-btn" style="padding: 16px; font-size: 14px; margin-top: 4px;">
                ${t('custLoginBtn')}
              </button>
            </form>
          </div>
        `;
        return;
      }

      // REGISTERED CUSTOMER VIEW: SADE & KOLAY TASARIM
      state.customerTab = state.customerTab || 'booking';
      pruneAppointmentsLimit();

      const myApts = state.appointments.filter(a => a && a.customerPhone === state.currentUser.phone);
      const myNotifs = state.notifications.filter(n => n.phone === state.currentUser.phone);
      const upcoming1h = myApts.find(check1HourReminder);

      // Check weekly schedule for selected date
      const parts = state.selectedDate.split('-');
      const dObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      const dayOfWeek = dObj.getDay();
      const sched = state.weeklySchedule[dayOfWeek] || { isOpen: true, start: '09:00', end: '21:00' };

      // Generate time slots
      const startHour = parseInt((sched.start || '09:00').split(':')[0]);
      const endHour = parseInt((sched.end || '21:00').split(':')[0]);
      const availableSlots = [];
      if (sched.isOpen) {
        for (let h = startHour; h <= endHour; h++) {
          const hh = h.toString().padStart(2, '0');
          availableSlots.push(`${hh}:00`);
          if (h !== endHour) availableSlots.push(`${hh}:30`);
        }
      }

      state.dateSlotOverrides.filter(o => o.date === state.selectedDate && o.status === 'opened').forEach(o => {
        if (!availableSlots.includes(o.time)) availableSlots.push(o.time);
      });
      availableSlots.sort();

      const now = new Date();
      const todayStr = getLocalDateStr(now);
      const tomorrowObj = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const tomorrowStr = getLocalDateStr(tomorrowObj);
      const isToday = state.selectedDate === todayStr;
      const isPastDate = state.selectedDate < todayStr;
      const currentHour = now.getHours();
      const currentMin = now.getMinutes();

      let allPastForToday = false;
      if (isToday && availableSlots.length > 0) {
        allPastForToday = availableSlots.every(time => {
          const [sHour, sMin] = time.split(':').map(Number);
          return sHour < currentHour || (sHour === currentHour && sMin <= currentMin);
        });
      }

      const activeSelectedService = state.selectedServiceId ? state.services.find(s => s.id === state.selectedServiceId) : null;

      let html = '';

      // 1. CLEAN LOGGED IN USER BAR
      html += `
        <div class="card" style="padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
          <div>
            <div style="font-size: 13px; font-weight: 800; color: #fff;">👤 ${state.currentUser.name}</div>
            <div style="font-size: 11px; color: var(--text-muted);">${state.currentUser.phone}</div>
          </div>
          <div style="display: flex; gap: 6px; align-items: center;">
            <button onclick="playNotificationSound(true)" style="background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: var(--gold-primary); padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer;">🔊 Sesi Test Et</button>
            <button onclick="logoutCustomer()" style="background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3); color: #fb7185; padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer;">🚪 ${t('logout')}</button>
          </div>
        </div>

      // NOTIFICATIONS TOASTS
      if (myNotifs.length > 0) {
        html += `<div style="margin-bottom: 12px;">`;
        myNotifs.forEach(n => {
          html += `
            <div class="notif-box">
              <div>
                <strong style="color: var(--gold-primary);">${n.title}</strong>
                <div style="color: #fff; margin-top: 2px;">${n.message}</div>
              </div>
              <button onclick="dismissNotif('${n.id}')" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 800;">✕</button>

      // 1-HOUR REMINDER BANNER

        // STEP 1: HİZMET SEÇİMİ (KAPALI BAŞLAR - TIKLAYINCA PENCERE AÇILIR)
        html += `

            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: 11px; font-weight: 800; color: var(--gold-primary);">${t('servicesTitle')}</span>
                <div style="font-size: 13px; font-weight: 800; color: #fff; margin-top: 2px;">
                  ${activeSelectedService ? `✓ ${getServiceName(activeSelectedService)} (${activeSelectedService.price} TL)` : `<span style="color: var(--gold-light); font-weight: 800;" class="animate-pulse">${t('selectServicePrompt')}</span>`}
                </div>
              </div>
              <button onclick="event.stopPropagation(); openServiceSelectionModal();" class="gold-btn" style="padding: 6px 14px; font-size: 11px; font-weight: 800;">
                ${activeSelectedService ? '✏️ ' + t('changeStep') : '✂️ Hizmet Seç'}

        // STEP 2: TARİH SEÇİMİ (KATLANABİLİR)
        const isStep2Open = state.accordionStep === 2;
        html += `
          <div id="step-2-container" style="background: #070c1a; border-radius: 14px; border: 1px solid ${isStep2Open ? 'var(--gold-primary)' : 'var(--border-color)'}; padding: 12px; margin-bottom: 12px; transition: all 0.2s;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: 11px; font-weight: 800; color: var(--gold-primary);">${t('dateTitle')}</span>
                <div style="font-size: 13px; font-weight: 800; color: #fff; margin-top: 2px;">
                  📅 ${state.selectedDate === todayStr ? t('today') + ' (' + state.selectedDate + ')' : state.selectedDate === tomorrowStr ? t('tomorrow') + ' (' + state.selectedDate + ')' : state.selectedDate}
                </div>
              </div>
              <button onclick="setAccordionStep(${isStep2Open ? 0 : 2})" style="background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: var(--gold-primary); padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer;">
                ${isStep2Open ? '▲ ' + t('closeStep') : '✏️ ' + t('changeStep')}
              </button>
            </div>

            ${isStep2Open ? `
              <div style="display: flex; gap: 6px; margin-top: 12px;">
                <button onclick="selectDateAccordion('${todayStr}')" style="flex: 1; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 800; border: 1px solid ${state.selectedDate === todayStr ? 'var(--gold-primary)' : 'var(--border-color)'}; background: ${state.selectedDate === todayStr ? 'var(--gold-primary)' : '#0f172a'}; color: ${state.selectedDate === todayStr ? '#000' : '#fff'}; cursor: pointer;">
                  📅 ${t('today')}
                </button>
                <button onclick="selectDateAccordion('${tomorrowStr}')" style="flex: 1; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 800; border: 1px solid ${state.selectedDate === tomorrowStr ? 'var(--gold-primary)' : 'var(--border-color)'}; background: ${state.selectedDate === tomorrowStr ? 'var(--gold-primary)' : '#0f172a'}; color: ${state.selectedDate === tomorrowStr ? '#000' : '#fff'}; cursor: pointer;">
                  📅 ${t('tomorrow')}
                </button>
                <input type="date" value="${state.selectedDate}" min="${todayStr}" onchange="selectDateAccordion(this.value)" class="input-field" style="flex: 1.2; padding: 8px; font-size: 11px; font-weight: 700;">
              </div>
            ` : ''}
          </div>
        `;

        // STEP 3: SAAT SEÇİMİ (KATLANABİLİR)
        const isStep3Open = state.accordionStep === 3;
        html += `
          <div style="background: #070c1a; border-radius: 14px; border: 1px solid ${isStep3Open ? 'var(--gold-primary)' : 'var(--border-color)'}; padding: 12px; margin-bottom: 14px; transition: all 0.2s;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: 11px; font-weight: 800; color: var(--gold-primary);">${t('timeTitle')}</span>
                <div style="font-size: 13px; font-weight: 800; color: ${state.selectedTime ? '#fff' : '#fb7185'}; margin-top: 2px;">
                  ${state.selectedTime ? '⏰ ' + state.selectedTime : t('selectTimeWarning')}
                </div>
              </div>
              <button onclick="setAccordionStep(${isStep3Open ? 0 : 3})" style="background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: var(--gold-primary); padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer;">
                ${isStep3Open ? '▲ ' + t('closeStep') : '✏️ ' + t('changeStep')}
              </button>
            </div>

            ${isStep3Open ? `
              ${!sched.isOpen ? `
                <div style="background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3); color: #fb7185; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 700; text-align: center; margin-top: 10px;">
                  ${t('salonClosedToday')}
                </div>
              ` : allPastForToday ? `
                <div style="background: rgba(245,158,11,0.15); border: 1px solid var(--gold-primary); color: #fbbf24; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 700; text-align: center; margin-top: 10px;">
                  ${t('workHoursFinishedToday')}
                  <button onclick="selectDateAccordion('${tomorrowStr}')" class="gold-btn" style="width: 100%; margin-top: 8px; padding: 10px; font-size: 12px; font-weight: 900;">${t('showTomorrowHours')}</button>
                </div>
              ` : `
                  ${(() => {
                    const occupiedSlotsSet = getOccupiedSlotsForDate(state.selectedDate);
                    const neededSlotsForActiveSvc = activeSelectedService ? getServiceSlotCount(activeSelectedService.duration) : 1;

                    return availableSlots.map(time => {
                      const override = state.dateSlotOverrides.find(b => b.date === state.selectedDate && b.time === time);
                      const isDirectlyBooked = occupiedSlotsSet.has(time);

                      // Check if there are enough consecutive free slots for the selected service duration
                      let hasEnoughConsecutiveTime = true;
                      const [startH, startM] = time.split(':').map(Number);
                      let checkMinTotal = startH * 60 + startM;

                      for (let i = 0; i < neededSlotsForActiveSvc; i++) {
                        const hh = Math.floor(checkMinTotal / 60).toString().padStart(2, '0');
                        const mm = (checkMinTotal % 60).toString().padStart(2, '0');
                        const checkTimeStr = `${hh}:${mm}`;

                        const checkOverride = state.dateSlotOverrides.find(b => b.date === state.selectedDate && b.time === checkTimeStr);
                        const isCheckBlocked = (checkOverride ? checkOverride.status === 'blocked' : false) || occupiedSlotsSet.has(checkTimeStr);

                        if (isCheckBlocked || !availableSlots.includes(checkTimeStr)) {
                          hasEnoughConsecutiveTime = false;
                          break;
                        }
                        checkMinTotal += 30;
                      }

                      const isBlocked = isDirectlyBooked || (override ? override.status === 'blocked' : false) || !hasEnoughConsecutiveTime;
                      const isSelected = state.selectedTime === time;

                      let isPast = false;
                      if (isToday) {
                        const [sHour, sMin] = time.split(':').map(Number);
                        if (sHour < currentHour || (sHour === currentHour && sMin <= currentMin)) {
                          isPast = true;
                        }
                      } else if (isPastDate) {
                        isPast = true;
                      }

                      const isDisabled = isBlocked || isPast;

                      return `
                        <button onclick="selectTimeAccordion('${time}')" ${isDisabled ? 'disabled' : ''} class="slot-btn ${isPast ? 'past' : ''} ${isBlocked ? 'blocked' : ''} ${isSelected ? 'selected' : ''}" style="padding: 8px 4px; font-size: 12px; font-weight: 800; border-radius: 10px;">
                          ${time}
                          ${isPast ? '<span style="display:block; font-size:7px; opacity:0.6;">' + t('slotPast') + '</span>' : isDirectlyBooked ? '<span style="display:block; font-size:7px; color:#fb7185;">' + t('slotBooked') + '</span>' : isBlocked ? '<span style="display:block; font-size:7px; color:#fb7185;">' + t('slotClosed') + '</span>' : ''}
                        </button>
                      `;
                    }).join('');
                  })()}
                </div>
              `}
            ` : ''}
          </div>
        `;

        // STEP 4: BIG DEV CONFIRMATION BUTTON
        html += `
          <div id="booking-confirm-bar" style="background: ${state.selectedTime && activeSelectedService ? 'linear-gradient(135deg, rgba(245,158,11,0.25), rgba(251,191,36,0.15))' : '#070c1a'}; border: 2px solid ${state.selectedTime && activeSelectedService ? 'var(--gold-primary)' : 'var(--border-color)'}; border-radius: 16px; padding: 16px; text-align: center; transition: all 0.3s ease; box-shadow: ${state.selectedTime && activeSelectedService ? '0 0 25px rgba(245,158,11,0.35)' : 'none'};">
            <div style="font-size: 14px; font-weight: 900; color: #fff;">
              📋 ${activeSelectedService ? getServiceName(activeSelectedService) : `<span style="color: var(--gold-light);">${t('selectServicePrompt')}</span>`} ${activeSelectedService ? '— <span style="color: var(--gold-primary); font-size: 16px;">' + activeSelectedService.price + ' TL</span>' : ''}
            </div>
            <div style="font-size: 13px; font-weight: 800; color: ${state.selectedTime ? 'var(--gold-primary)' : 'var(--text-muted)'}; margin-top: 4px;">
              📅 ${state.selectedDate} — ⏰ ${state.selectedTime ? state.selectedTime : t('selectTimeFirst')}
            </div>

            <button onclick="submitBooking()" class="gold-btn ${state.selectedTime && activeSelectedService ? 'animate-pulse' : ''}" style="width: 100%; margin-top: 12px; padding: 16px; font-size: 16px; font-weight: 900; background: ${state.selectedTime && activeSelectedService ? 'linear-gradient(135deg, #fbbf24, #f59e0b)' : '#1e293b'}; color: ${state.selectedTime && activeSelectedService ? '#000' : 'var(--text-muted)'}; border: 1px solid ${state.selectedTime && activeSelectedService ? 'var(--gold-primary)' : 'var(--border-color)'}; border-radius: 12px;">
              ${state.selectedTime && activeSelectedService ? t('bookBtn') : '⏰ ' + (activeSelectedService ? t('selectTimeFirst') : t('selectServicePrompt'))}
            </button>
          </div>
        `;

        html += `</div>`;
      }

      // 4. MY APPOINTMENTS TAB CONTENT
      else if (state.customerTab === 'myAppointments') {
        html += `
          <div class="card">
            <h3 style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 14px;">${t('myAppointments')} (${myApts.length})</h3>
            ${myApts.length === 0 ? `
              <div style="text-align: center; padding: 30px 10px;">
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">${t('noAppointments')}</p>
                <button onclick="setCustomerTab('booking')" class="gold-btn" style="padding: 12px 20px; font-size: 13px;">📅 ${t('bookNowBtn')}</button>
              </div>
            ` : `
              <div style="display: flex; flex-direction: column; gap: 12px;">
                ${myApts.map(a => {
                  const is1h = check1HourReminder(a);
                  const statusText = a.status === 'approved' ? t('statusApprovedText') : a.status === 'rejected' ? t('statusRejectedText') : a.status === 'cancelled' ? t('statusCancelledText') : t('statusPendingText');
                  const canModify = a.status !== 'cancelled' && a.status !== 'rejected';
                  
                  return `
                    <div style="background: #070c1a; padding: 14px; border-radius: 14px; border: 1px solid ${is1h ? 'var(--gold-primary)' : 'var(--border-color)'}; display: flex; flex-direction: column; gap: 10px;">
                      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                          <div style="font-weight: 800; font-size: 14px; color: #fff;">${a.serviceName}</div>
                          <div style="font-size: 12px; color: var(--gold-primary); font-weight: 700; margin-top: 2px;">📅 ${a.date} — ⏰ ${a.time} (${a.price} TL)</div>
                          ${is1h ? `<span class="badge badge-pending animate-pulse" style="margin-top: 4px;">${t('reminderBadge')}</span>` : ''}
                        </div>
                        <div>
                          <span class="badge ${a.status === 'approved' ? 'badge-approved' : a.status === 'rejected' || a.status === 'cancelled' ? 'badge-rejected' : 'badge-pending'}">
                            ${statusText}
                          </span>
                        </div>
                      </div>

                      ${canModify ? `

              </div>
            `;
          });
          html += `</div>`;
        }

        html += `</div>`;
      }

      // 2. WEEKLY SCHEDULE TAB
      else if (state.adminTab === 'weeklySchedule') {
        const days = [
          { idx: 1, key: 'dayMonday' }, { idx: 2, key: 'dayTuesday' }, { idx: 3, key: 'dayWednesday' },
          { idx: 4, key: 'dayThursday' }, { idx: 5, key: 'dayFriday' }, { idx: 6, key: 'daySaturday' }, { idx: 0, key: 'daySunday' }

        html += `
          <div>

              ${days.map(d => {
                const sched = state.weeklySchedule[d.idx] || { isOpen: true, start: '12:00', end: '22:00' };
                return `
                  <div style="background: #070c1a; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">

                        ${sched.isOpen ? t('dayIsOpen') : t('dayIsClosed')}

                      <span style="font-weight: 800; font-size: 13px; color: #fff; white-space: nowrap;">${t(d.key)}</span>

                    ${sched.isOpen ? `

                        </div>
                        <div style="display: flex; align-items: center; gap: 4px;">
                          <span style="font-size: 11px; color: var(--text-muted); font-weight: 700; white-space: nowrap;">${t('closingTime')}:</span>
                          <input type="time" value="${sched.end}" onchange="updateScheduleTime(${d.idx}, 'end', this.value)" class="input-field" style="padding: 5px 8px; width: 95px; font-size: 12px; font-weight: 700; text-align: center;">

              ${t('saveWeeklyScheduleBtn')}
            </button>
          </div>
        `;
      }

      // 3. SLOT LOCKING TAB
      else if (state.adminTab === 'slotLocking') {
        const timeSlots = [];
        for (let h = 0; h < 24; h++) {
          const hh = h.toString().padStart(2, '0');
          timeSlots.push(`${hh}:00`);
          timeSlots.push(`${hh}:30`);
        }

        html += `
          <div>
            <h3 style="font-size: 15px; font-weight: 900; color: var(--gold-primary); margin-bottom: 6px;">${t('slotLockingTitle')}</h3>

              ${timeSlots.map(time => {
                const override = state.dateSlotOverrides.find(b => b.date === state.selectedDate && b.time === time);
                const isBlocked = override ? override.status === 'blocked' : false;
                const isOpened = override ? override.status === 'opened' : false;

                return `
                  <button onclick="toggleDateSlotOverride('${state.selectedDate}', '${time}')" class="slot-btn ${isBlocked ? 'blocked' : isOpened ? 'opened' : ''}" style="padding: 8px 4px; font-size: 12px; font-weight: 800; border-radius: 10px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    ${time}
                    <span style="display: block; font-size: 9px; font-weight: 800; white-space: nowrap; margin-top: 2px;">${isBlocked ? '🔒 ' + t('slotClosed') : isOpened ? '✅ ' + t('slotOpened') : '• ' + t('slotNormal')}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <button onclick="confirmScheduleChanges()" class="gold-btn" style="width: 100%; padding: 18px; font-size: 15px; font-weight: 900;">
              ${t('saveSlotLockBtn')}
            </button>
          </div>
        `;
      }

      else if (state.adminTab === 'servicesAdmin') {
        html += `
          <div>
            <h3 style="font-size: 15px; font-weight: 900; color: var(--gold-primary); margin-bottom: 6px;">✂️ ${t('servicesAdmin')}</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">${t('servicesAdminDesc')}</p>

            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">

                          <option value="45 dk" ${s.duration === '45 dk' ? 'selected' : ''}>45 dk</option>
                          <option value="60 dk" ${s.duration === '60 dk' || s.duration === '1 saat' ? 'selected' : ''}>60 dk (1 Saat)</option>
                          <option value="90 dk" ${s.duration === '90 dk' || s.duration === '1.5 saat' ? 'selected' : ''}>90 dk (1.5 Saat)</option>
                          <option value="120 dk" ${s.duration === '120 dk' || s.duration === '2 saat' ? 'selected' : ''}>120 dk (2 Saat)</option>
                          <option value="150 dk" ${s.duration === '150 dk' || s.duration === '2.5 saat' ? 'selected' : ''}>150 dk (2.5 Saat)</option>
                          <option value="180 dk" ${s.duration === '180 dk' || s.duration === '3 saat' ? 'selected' : ''}>180 dk (3 Saat)</option>
                        </select>
                      </div>
                      <div>
                        <label style="font-size: 10px; color: var(--text-muted); font-weight: 700;">${t('priceLabel')}:</label>
                        <input type="number" value="${s.price}" oninput="updateServiceField('${s.id}', 'price', Number(this.value))" class="input-field" style="padding: 8px 10px; font-size: 13px; color: var(--gold-primary); font-weight: 900;">
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}

            <!-- ADD NEW SERVICE FORM -->
            <div style="background: #070c1a; padding: 16px; border-radius: 16px; border: 1px dashed var(--gold-primary); margin-bottom: 20px;">

                  <option value="45 dk">45 dk</option>
                  <option value="60 dk">60 dk (1 Saat)</option>
                  <option value="90 dk" selected>90 dk (1.5 Saat)</option>

            <button onclick="saveServices()" class="gold-btn" style="width: 100%; padding: 18px; font-size: 15px; font-weight: 900;">
              💾 ${t('saveServicesBtn')}
            </button>
          </div>
        `;
      }

      // 2. MANUAL BOOKING TAB (ADMIN ÖZEL RANDEVU ALMA & CANLI TAKVİM)
      else if (state.adminTab === 'manualBooking') {
        const adminDate = state.adminSelectedDate || state.selectedDate || getInitialBookingDate();
        const parts = adminDate.split('-');
        const dObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        const dayOfWeek = dObj.getDay();
        const sched = state.weeklySchedule[dayOfWeek] || { isOpen: true, start: '09:00', end: '21:00' };

        const startHour = parseInt((sched.start || '09:00').split(':')[0]);
        const endHour = parseInt((sched.end || '21:00').split(':')[0]);
        const availableSlots = [];
        if (sched.isOpen) {
          for (let h = startHour; h <= endHour; h++) {
            const hh = h.toString().padStart(2, '0');
            availableSlots.push(`${hh}:00`);
            if (h !== endHour) availableSlots.push(`${hh}:30`);
          }
        }
        availableSlots.sort();

        const occupiedSet = getOccupiedSlotsForDate(adminDate);

        html += `
          <div class="card" style="padding: 16px;">
            <h3 style="font-size: 15px; font-weight: 900; color: var(--gold-primary); margin-bottom: 12px;">📅 Manuel Randevu Ekle & Canlı Takvim</h3>

            <div style="background: #070c1a; padding: 12px; border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 16px;">

                <input type="date" value="${adminDate}" onchange="setAdminBookingDate(this.value)" class="input-field" style="width: auto; padding: 6px 12px; font-size: 12px; font-weight: 800;">

                <span style="color: #fb7185;">🔴 Müşteri Randevusu</span>
                <span style="color: #94a3b8;">⚪ Salon Kapalı / Engel</span>

              <div class="slot-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;">
                ${availableSlots.map(time => {
                  const override = state.dateSlotOverrides.find(b => b.date === adminDate && b.time === time);
                  const isBooked = occupiedSet.has(time);
                  const isBlocked = (override ? override.status === 'blocked' : false);
                  
                  const apt = isBooked ? state.appointments.find(a => a.date === adminDate && a.time === time && a.status !== 'cancelled' && a.status !== 'rejected') : null;

    // --- SERVICE DURATION & MULTI-SLOT CALCULATION ENGINE ---
    function getServiceSlotCount(durationStr) {
      if (!durationStr) return 1;
      const str = durationStr.toString().toLowerCase();

      const minMatch = str.match(/(\d+)\s*(dk|min)/);
      if (minMatch) {
        const mins = parseInt(minMatch[1], 10);
        return Math.max(1, Math.ceil(mins / 30));
      }

      const hourMatch = str.match(/(\d+(?:\.\d+)?)\s*(saat|hr)/);
      if (hourMatch) {
        const hours = parseFloat(hourMatch[1]);
        return Math.max(1, Math.ceil((hours * 60) / 30));
      }

      return 1;
    }

    function getOccupiedSlotsForDate(dateStr) {
      const occupied = new Set();
      const dateApts = (state.appointments || []).filter(a => a && a.date === dateStr && a.status !== 'cancelled' && a.status !== 'rejected');

      dateApts.forEach(apt => {
        if (!apt.time) return;
        let slotsNeeded = 1;
        const svc = (state.services || []).find(s => s.name === apt.serviceName);
        if (svc && svc.duration) {
          slotsNeeded = getServiceSlotCount(svc.duration);
        } else if (apt.serviceDuration) {
          slotsNeeded = getServiceSlotCount(apt.serviceDuration);
        }

        const [startH, startM] = apt.time.split(':').map(Number);
        if (isNaN(startH) || isNaN(startM)) return;

        let curMinTotal = startH * 60 + startM;
        for (let i = 0; i < slotsNeeded; i++) {
          const hh = Math.floor(curMinTotal / 60).toString().padStart(2, '0');
          const mm = (curMinTotal % 60).toString().padStart(2, '0');
          occupied.add(`${hh}:${mm}`);
          curMinTotal += 30;
        }
      });

      return occupied;
    }

    // --- AUTOMATIC CLEANUP ENGINE (7 GÜNDEN ESKİ RANDEVULARI SİL + MÜŞTERİ BAŞINA MAKSİMUM 5 RANDEVU KORU) ---
    function pruneAppointmentsLimit() {
      if (!Array.isArray(state.appointments)) return;
      
      // 1. 7 günden daha eski randevuları otomatik olarak veritabanından temizle
      const now = new Date();
      const sevenDaysAgoObj = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7);
      const cutoff7DaysAgo = getLocalDateStr(sevenDaysAgoObj);

      let validApts = state.appointments.filter(a => {
        if (!a || !a.date) return false;
        return a.date >= cutoff7DaysAgo; // Son 7 gün, bugün veya gelecek randevular kalsın
      });

      // 2. Müşteri başına en fazla en güncel 5 randevuyu koru
      const byPhone = {};
      validApts.forEach(a => {
        if (!a || !a.customerPhone) return;
        if (!byPhone[a.customerPhone]) byPhone[a.customerPhone] = [];
        byPhone[a.customerPhone].push(a);
      });

      const keptIds = new Set();
      Object.keys(byPhone).forEach(phone => {
        const list = byPhone[phone];
        list.sort((a, b) => {
          const dtA = (a.date || '') + ' ' + (a.time || '');
          const dtB = (b.date || '') + ' ' + (b.time || '');
          return dtB.localeCompare(dtA);
        });
        list.slice(0, 5).forEach(a => keptIds.add(a.id));
      });

      state.appointments = validApts.filter(a => !a || !a.customerPhone || keptIds.has(a.id));
      localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));
    }

    // --- TRIPLE-REDUNDANT HIGH-AVAILABILITY REAL-TIME CLOUD BACKEND ENGINE ---
    const CLOUD_ENDPOINTS = [
      'https://ezostile-barber-default-rtdb.europe-west1.firebasedatabase.app/ezostile_v5.json'
    ];
    let isSyncingCloud = false;
    let lastCloudUpdateTimestamp = Number(localStorage.getItem('gc_last_cloud_ts') || 0);
    let lastLocalUpdateTimestamp = Number(localStorage.getItem('gc_last_local_ts') || 0);

    async function syncToCloud(overridePayload = null) {
      const now = Date.now();
      lastLocalUpdateTimestamp = now;
      localStorage.setItem('gc_last_local_ts', now.toString());

      const payload = overridePayload || {
        adminPassword: state.adminPassword,
        managerPasswords: state.managerPasswords,
        appointments: state.appointments,
        dateSlotOverrides: state.dateSlotOverrides,
        weeklySchedule: state.weeklySchedule,
        services: state.services,
        notifications: state.notifications,
        adminPhone: state.adminPhone,
        updatedAt: now
      };

      const bodyStr = JSON.stringify(payload);

      await Promise.allSettled(CLOUD_ENDPOINTS.map(url =>
        fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: bodyStr
        }).catch(() => {})
      ));
    }

    let sharedAudioCtx = null;

    function getAudioContext() {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    }

    // Auto unlock Web Audio API context on first touch/click for mobile browsers (iOS Safari / Android Chrome)
    document.addEventListener('touchstart', getAudioContext, { once: true });
    document.addEventListener('click', getAudioContext, { once: true });

    function playNotificationSound(isSuccess = true) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type = 'sine';

        if (isSuccess) {
          // Melodic 3-note VIP chime: C5 (523Hz) -> E5 (659Hz) -> G5 (784Hz)
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.12);
          osc.frequency.setValueAtTime(783.99, now + 0.24);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

          osc.start(now);
          osc.stop(now + 0.65);
        } else {
          // Warning chime: F4 (349Hz) -> C4 (261Hz)
          osc.frequency.setValueAtTime(349.23, now);
          osc.frequency.setValueAtTime(261.63, now + 0.15);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc.start(now);
          osc.stop(now + 0.5);
        }
      } catch (e) {
        console.log('Audio error:', e);
      }
    }

    async function fetchFromCloud() {
      if (isSyncingCloud) return;
      try {
        isSyncingCloud = true;
        let latestData = null;

        for (const url of CLOUD_ENDPOINTS) {
          try {
            const res = await fetch(url, { cache: 'no-store' });
            if (res.ok) {
              const text = await res.text();
              if (text && text.trim().startsWith('{')) {
                const parsed = JSON.parse(text);
                if (parsed && parsed.updatedAt) {
                  if (!latestData || parsed.updatedAt > latestData.updatedAt) {
                    latestData = parsed;
                  }
                }
              }
            }
          } catch (e) {}
        }

        if (latestData && latestData.updatedAt) {
          // Sadece başka bir cihazdan gelen yeni veriyi kabul et
          if (latestData.updatedAt > lastCloudUpdateTimestamp && Math.abs(latestData.updatedAt - lastLocalUpdateTimestamp) > 1000) {
            
            // Check for new pending appointments for Admin audio chime & lock screen notification
            if (state.role !== 'customer' && latestData.appointments) {
              const oldPending = (state.appointments || []).filter(a => a.status === 'pending').length;
              const newPending = latestData.appointments.filter(a => a.status === 'pending').length;
              if (newPending > oldPending) {
                playNotificationSound();
                const newestApt = latestData.appointments.find(a => a.status === 'pending');
                const aptInfo = newestApt ? `${newestApt.customerName} - ${newestApt.date} ${newestApt.time}` : 'Yeni randevu';
                triggerLockScreenNotification("EZO STİLE - VIP Berber 💇‍♂️", `⚠️ Randevu onayı bekliyor! (${aptInfo})`);
              }
            }

            // Check if Customer's pending appointment was approved or rejected
            if (state.currentUser && latestData.appointments) {
              const myOldPending = (state.appointments || []).filter(a => a.customerPhone === state.currentUser.phone && a.status === 'pending');
              myOldPending.forEach(oldApt => {
                const updated = latestData.appointments.find(a => a.id === oldApt.id);
                if (updated && updated.status === 'approved') {
                  playNotificationSound(true);
                  triggerLockScreenNotification("EZO STİLE - Randevu Onaylandı! ✅", `Randevunuz onaylandı: ${updated.serviceName} (${updated.date} ${updated.time})`);
                } else if (updated && updated.status === 'rejected') {
                  playNotificationSound(false);
                  triggerLockScreenNotification("EZO STİLE - Randevu İptal/Red ❌", `Randevu talebiniz onaylanamadı. (${updated.date} ${updated.time})`);
                }
              });
            }

            lastCloudUpdateTimestamp = latestData.updatedAt;
            localStorage.setItem('gc_last_cloud_ts', latestData.updatedAt.toString());

            if (latestData.adminPassword) {
              state.adminPassword = latestData.adminPassword;
              localStorage.setItem('gc_admin_pwd', latestData.adminPassword);
            }
            if (latestData.managerPasswords) {
              state.managerPasswords = Array.isArray(latestData.managerPasswords) ? latestData.managerPasswords : ['5555'];
              localStorage.setItem('gc_manager_pwds', JSON.stringify(state.managerPasswords));
            }
            if (latestData.appointments) {
              state.appointments = Array.isArray(latestData.appointments) ? latestData.appointments : [];
              pruneAppointmentsLimit();
            }
            if (latestData.dateSlotOverrides) {
              state.dateSlotOverrides = Array.isArray(latestData.dateSlotOverrides) ? latestData.dateSlotOverrides : [];
              localStorage.setItem('gc_date_slot_overrides', JSON.stringify(state.dateSlotOverrides));
            }
            if (latestData.weeklySchedule) {
              state.weeklySchedule = latestData.weeklySchedule;
              localStorage.setItem('gc_weekly_schedule', JSON.stringify(state.weeklySchedule));
            }
            if (latestData.services) {
              state.services = Array.isArray(latestData.services) ? latestData.services : DEFAULT_SERVICES;
              localStorage.setItem('gc_services', JSON.stringify(state.services));
            }
            if (latestData.adminPhone) {
              state.adminPhone = latestData.adminPhone;
              localStorage.setItem('gc_admin_phone', latestData.adminPhone);
            }
            if (latestData.notifications) {
              state.notifications = Array.isArray(latestData.notifications) ? latestData.notifications : [];
              localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));
            }

            sanitizeState();
            renderApp();
          }
        } else if (lastLocalUpdateTimestamp === 0 && (!latestData || !latestData.updatedAt)) {
          // Initial seed sync if cloud is completely empty
          syncToCloud();
        }
      } catch (err) {
        // Silent catch
      } finally {
        isSyncingCloud = false;
      }
    }

    // Auto poll cloud DB every 1.5 seconds for instant multi-device sync
    fetchFromCloud();
    setInterval(fetchFromCloud, 1500);

    // Sync on tab focus or visibility change
    window.addEventListener('focus', fetchFromCloud);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) fetchFromCloud();
    });

      let msgText = '';
      let modalTitle = '';

      if (state.language === 'en') {
        modalTitle = isCancel ? '📲 Request Appointment Cancellation' : '✏️ Request Appointment Change';

    function formatPhoneForWa(phone) {
      let clean = (phone || '').replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '90' + clean.substring(1);
      else if (!clean.startsWith('90') && clean.length === 10) clean = '90' + clean;
      return clean;
    }

    function sendCustomerWhatsApp(phone, text) {

    function isValidTurkishGsm(phone) {
      let clean = (phone || '').replace(/\D/g, '');
      if (clean.startsWith('90')) clean = clean.substring(2);
      if (clean.startsWith('0')) clean = clean.substring(1);
      
      if (clean.length !== 10 || !clean.startsWith('5')) return false;
      if (/^(\d)\1{9}$/.test(clean)) return false;
      if (clean === '1234567890' || clean === '5454646352' || clean === '5000000000') return false;

      const prefix = parseInt(clean.substring(0, 3));
      if ((prefix >= 501 && prefix <= 509) || 
          (prefix >= 530 && prefix <= 539) || 
          (prefix >= 540 && prefix <= 549) || 
          (prefix >= 551 && prefix <= 559) || 
          prefix === 561) {
        return true;
      }
      return false;
    }

        return;

        window.confirmationResult.confirm(val)

            closeModal();

      const pwd = (document.getElementById('staff-pwd')?.value || '').trim();
      const masterPwd = state.adminPassword || '1405';
      const managerList = state.managerPasswords || ['5555'];

      if (pwd === masterPwd) {
        closeModal();
        switchRole('admin');
      } else if (managerList.includes(pwd) || pwd === '5555') {
        closeModal();
        switchRole('manager');
      } else {
        alert('❌ Hatalı yetkili şifresi!');
      }
    }

    function setAdminBookingDate(dStr) {
      state.adminSelectedDate = dStr;
      renderApp();
    }

    function selectTimeForAdminManualBook(tStr) {
      const timeSelect = document.getElementById('admin-book-time');
      if (timeSelect) timeSelect.value = tStr;
      const nameInput = document.getElementById('admin-book-name');
      if (nameInput) nameInput.focus();
    }

    function submitAdminManualBooking(e) {
      if (e) e.preventDefault();
      const name = document.getElementById('admin-book-name').value.trim();
      const phone = document.getElementById('admin-book-phone').value.trim();
      const svcId = document.getElementById('admin-book-service').value;
      const time = document.getElementById('admin-book-time').value;
      const note = (document.getElementById('admin-book-note')?.value || '').trim();

      if (!name || !phone || !time || !svcId) {
        alert('Lütfen tüm zorunlu alanları doldurunuz.');
        return;
      }

      const svc = state.services.find(s => s.id === svcId) || state.services[0];
      const date = state.adminSelectedDate || state.selectedDate || getInitialBookingDate();

      const newApt = {
        id: Date.now().toString(),
        customerName: name,
        customerPhone: phone,
        serviceName: getServiceName(svc),
        serviceDuration: svc.duration,
        date: date,
        time: time,
        price: svc.price,
        status: 'approved',
        note: note || 'Admin Manuel Kayıt'
      };

      state.appointments.unshift(newApt);
      localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));
      syncToCloud();
      window.dispatchEvent(new Event('storage'));
      if (typeof playNotificationSound === 'function') playNotificationSound(true);
      alert(`✅ ${name} için ${date} ${time} saatine manuel randevu başarıyla eklendi ve onaylandı!`);
      renderApp();
    }

    function saveAdminPassword() {
      const val = (document.getElementById('master-admin-pwd-input')?.value || '').trim();
      if (!val || val.length < 3) {
        alert('Lütfen geçerli bir Patron şifresi giriniz (en az 3 karakter).');
        return;
      }
      state.adminPassword = val;
      localStorage.setItem('gc_admin_pwd', val);
      syncToCloud();
      alert('✅ Patron ana admin şifresi başarıyla güncellendi!');
      renderApp();
    }

    function addManagerPin() {
      const val = (document.getElementById('new-manager-pin-input')?.value || '').trim();
      if (!val || val.length < 3) {
        alert('Lütfen geçerli bir personel şifresi giriniz (en az 3 karakter).');
        return;
      }
      state.managerPasswords = state.managerPasswords || ['5555'];
      if (state.managerPasswords.includes(val)) {
        alert('Bu şifre zaten mevcut.');
        return;
      }
      state.managerPasswords.push(val);
      localStorage.setItem('gc_manager_pwds', JSON.stringify(state.managerPasswords));
      syncToCloud();
      alert(`✅ Personel şifresi "${val}" başarıyla eklendi!`);
      renderApp();
    }

    function deleteManagerPin(pin) {
      if ((state.managerPasswords || []).length <= 1) {
        alert('En az bir personel şifresi kalmalıdır.');
        return;
      }
      state.managerPasswords = state.managerPasswords.filter(p => p !== pin);
      localStorage.setItem('gc_manager_pwds', JSON.stringify(state.managerPasswords));
      syncToCloud();
      alert(`✅ Personel şifresi "${pin}" silindi.`);
      renderApp();
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function setAdminTab(tab) {
      state.adminTab = tab;
      renderApp();
    }

    function setRequestsSubTab(sub) {
      state.requestsSubTab = sub;
      renderApp();
    }

    function toggleDayOpen(idx) {
      state.weeklySchedule[idx].isOpen = !state.weeklySchedule[idx].isOpen;
      localStorage.setItem('gc_weekly_schedule', JSON.stringify(state.weeklySchedule));
      syncToCloud();
      renderApp();
    }

    function updateScheduleTime(idx, key, val) {
      state.weeklySchedule[idx][key] = val;
      localStorage.setItem('gc_weekly_schedule', JSON.stringify(state.weeklySchedule));
      syncToCloud();
    }

    function confirmScheduleChanges() {
      localStorage.setItem('gc_weekly_schedule', JSON.stringify(state.weeklySchedule));
      localStorage.setItem('gc_date_slot_overrides', JSON.stringify(state.dateSlotOverrides));
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      window.dispatchEvent(new Event('storage'));
      alert(t('scheduleConfirmedToast'));
      renderApp();
    }

    // --- DATE SPECIFIC SLOT OVERRIDE ---
    function toggleDateSlotOverride(date, time) {
      const idx = state.dateSlotOverrides.findIndex(b => b.date === date && b.time === time);
      if (idx > -1) {
        const cur = state.dateSlotOverrides[idx];
        if (cur.status === 'blocked') {
          cur.status = 'opened';
        } else {
          state.dateSlotOverrides.splice(idx, 1);
        }
      } else {
        state.dateSlotOverrides.push({ date, time, status: 'blocked' });
      }
      localStorage.setItem('gc_date_slot_overrides', JSON.stringify(state.dateSlotOverrides));
      syncToCloud();
      window.dispatchEvent(new Event('storage'));
      renderApp();
    }

    // --- ADMIN APPROVE & REJECT WITH LIVE NOTIFICATION & SMS/WA ---
    function openNotificationActionModal(apt, type) {
      const isApprove = type === 'approved';
      const title = isApprove ? t('aptApprovedTitle') : t('aptRejectedTitle');
      
      let msgText = '';
      if (isApprove) {
        if (state.language === 'en') {
          msgText = `Dear ${apt.customerName}, your appointment at EZO STİLE on ${apt.date} at ${apt.time} (${apt.serviceName}) has been APPROVED. See you soon!`;
        } else if (state.language === 'ru') {
          msgText = `Уважаемый(ая) ${apt.customerName}, ваша запись в EZO STİLE на ${apt.date} в ${apt.time} (${apt.serviceName}) ОДОБРЕНА. Ждем вас!`;
        } else if (state.language === 'tk') {
          msgText = `Hormatly ${apt.customerName}, EZO STİLE üçin ${apt.date} sagat ${apt.time} (${apt.serviceName}) bronuňyz TASSYKLANYLDY. Garaşýarys!`;
        } else {
          msgText = `Sayın ${apt.customerName}, EZO STİLE için ${apt.date} saat ${apt.time} tarihindeki (${apt.serviceName}) randevunuz ONAYLANMIŞTIR. Bekliyoruz!`;
        }
      } else {
        if (state.language === 'en') {
          msgText = `Dear ${apt.customerName}, your appointment at EZO STİLE on ${apt.date} at ${apt.time} could unfortunately not be approved. Best regards.`;
        } else if (state.language === 'ru') {
          msgText = `Уважаемый(ая) ${apt.customerName}, к сожалению, ваша запись в EZO STİLE на ${apt.date} в ${apt.time} не подтверждена. С уважением.`;
        } else if (state.language === 'tk') {
          msgText = `Hormatly ${apt.customerName}, gynansak-da EZO STİLE üçin ${apt.date} sagat ${apt.time} bronuňyz tassyklanyp bilinmedi. Sylaşyk bilen.`;
        } else {
          msgText = `Sayın ${apt.customerName}, EZO STİLE için ${apt.date} saat ${apt.time} tarihindeki randevunuz maalesef onaylanamamıştır. Saygılarımızla.`;
        }
      }

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-content" style="text-align: center;">
            <h3 style="font-size: 16px; font-weight: 900; color: ${isApprove ? 'var(--emerald)' : 'var(--rose)'}; margin-bottom: 8px;">${title}</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">${t('notifyCustomerPrompt')}</p>
            
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; font-size: 11px; color: #fff; margin-bottom: 16px; text-align: left;">
              <strong>${t('sampleMessage')}:</strong><br/>
              <em>"${msgText}"</em>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button onclick="sendCustomerWhatsApp('${apt.customerPhone}', '${msgText.replace(/'/g, "\\'")}'); closeModal();" class="gold-btn" style="background: #25D366; color: #fff; border: none; display: flex; align-items: center; justify-content: center; gap: 6px;">
                💬 ${t('sendWaInfo')}
              </button>
              <button onclick="sendCustomerSms('${apt.customerPhone}', '${msgText.replace(/'/g, "\\'")}'); closeModal();" class="gold-btn" style="background: #3b82f6; color: #fff; border: none; display: flex; align-items: center; justify-content: center; gap: 6px;">
                📱 ${t('sendSmsInfo')}
              </button>
              <button onclick="closeModal()" class="gold-btn" style="background: #1e293b; color: #aaa;">
                ${t('closeBtn')}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function adminApproveApt(id) {
      const apt = state.appointments.find(a => a.id === id);
      if (apt) {
        apt.status = 'approved';
        localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));

        const notif = {
          id: Date.now().toString(),
          phone: apt.customerPhone,
          title: '🎉 Randevunuz Onaylandı!',
          message: `EZO STİLE: ${apt.serviceName} randevunuz ${apt.date} saat ${apt.time} için ONAYLANDI.`,
          date: new Date().toLocaleTimeString()
        };
        state.notifications.unshift(notif);
        localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));

        syncToCloud();
        window.dispatchEvent(new Event('storage'));
        renderApp();
        openNotificationActionModal(apt, 'approved');
      }
    }

    function adminRejectApt(id) {
      const apt = state.appointments.find(a => a.id === id);
      if (apt) {
        apt.status = 'rejected';
        localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));

        const notif = {
          id: Date.now().toString(),
          phone: apt.customerPhone,
          title: '❌ Randevunuz İptal Edildi / Reddedildi',
          message: `EZO STİLE: ${apt.serviceName} randevunuz ${apt.date} ${apt.time} tarihi için reddedildi/iptal edildi.`,
          date: new Date().toLocaleTimeString()
        };
        state.notifications.unshift(notif);
        localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));

        syncToCloud();
        window.dispatchEvent(new Event('storage'));
        renderApp();
        openNotificationActionModal(apt, 'rejected');
      }
    }

    function dismissNotif(notifId) {
      state.notifications = state.notifications.filter(n => n.id !== notifId);
      localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));
      syncToCloud();
      renderApp();
    }

    // --- SERVICE MANAGEMENT FUNCTIONS ---
    function updateServiceField(id, field, value) {
      const svc = state.services.find(s => s.id === id);
      if (svc) {
        svc[field] = field === 'price' ? Number(value) : value;
        localStorage.setItem('gc_services', JSON.stringify(state.services));
        syncToCloud();
      }
    }

    function addNewService() {
      const name = document.getElementById('new-svc-name').value;
      const duration = document.getElementById('new-svc-dur').value || '30 dk';
      const price = Number(document.getElementById('new-svc-price').value || 200);

      if (!name) {
        alert('Lütfen hizmet adını giriniz.');
        return;
      }

      const newSvc = {
        id: Date.now().toString(),
        name,
        duration,
        price
      };

      state.services.push(newSvc);
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      alert(`✅ "${name}" hizmeti başarıyla eklendi!`);
      renderApp();
    }

    function deleteService(id) {
      if (state.services.length <= 1) {
        alert('En az bir hizmet kalmalıdır.');
        return;
      }
      state.services = state.services.filter(s => s.id !== id);
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      renderApp();
    }

    function saveServices() {
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      alert('✅ Tüm hizmet isimleri ve fiyatlar başarıyla kaydedildi!');
      renderApp();
    }

    // --- INITIALIZATION ---
    renderApp();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderApp);
    }

    // Storage live sync listener
    window.addEventListener('storage', () => {
      state.weeklySchedule = JSON.parse(localStorage.getItem('gc_weekly_schedule') || JSON.stringify(state.weeklySchedule));
      state.dateSlotOverrides = JSON.parse(localStorage.getItem('gc_date_slot_overrides') || '[]');
      state.services = JSON.parse(localStorage.getItem('gc_services') || JSON.stringify(state.services));
      state.appointments = JSON.parse(localStorage.getItem('gc_appointments') || '[]');
      state.notifications = JSON.parse(localStorage.getItem('gc_notifications') || '[]');
      renderApp();
    });
  </script>
</body>
</html>
