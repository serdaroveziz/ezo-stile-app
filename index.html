    function triggerLockScreenNotification(title, message) {
      if (typeof state !== 'undefined') {
        if (typeof state.lockScreenNotifEnabled === 'undefined') { state.lockScreenNotifEnabled = localStorage.getItem('gc_lock_notif_enabled') === 'true'; }
        if (state.lockScreenNotifEnabled === false) return;
      }

      if ('Notification' in window && Notification.permission === 'granted') {
        const options = {
          body: message,
          icon: './logo.png',
          badge: './logo.png',
          vibrate: [300, 100, 300, 100, 300],
          tag: 'randevu-onayi-' + Date.now(),
          renotify: true,
          requireInteraction: true
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, options);
          }).catch(() => {
            try { const n = new Notification(title, options); n.onclick = function() { n.close(); window.focus(); }; } catch(e) {}
          });
        } else {
          try { const n = new Notification(title, options); n.onclick = function() { n.close(); window.focus(); }; } catch(e) {}
        }
      }
    }

    function toggleLockScreenNotifications() {
      if (typeof state === 'undefined') return;

      if (typeof state.lockScreenNotifEnabled === 'undefined') {
        state.lockScreenNotifEnabled = localStorage.getItem('gc_lock_notif_enabled') === 'true';
      }

      const willTurnOn = !state.lockScreenNotifEnabled;

      if (willTurnOn) {
        state.lockScreenNotifEnabled = true;
        localStorage.setItem('gc_lock_notif_enabled', 'true');

        if ('Notification' in window && Notification.permission !== 'granted') {
          try {
            Notification.requestPermission().then(permission => {
              if (permission === 'denied') {
                alert('⚠️ Telefonunuzun tarayıcı ayarlarından EZO STİLE için bildirim iznini açmanız gerekmektedir.');
              }
              if (state.role === 'customer' && typeof openCustomerProfileModal === 'function') openCustomerProfileModal();
              else if (typeof openAdminProfileModal === 'function') openAdminProfileModal();
            }).catch(() => {});
          } catch(e) {}
        }
      } else {
        state.lockScreenNotifEnabled = false;
        localStorage.setItem('gc_lock_notif_enabled', 'false');
      }

      if (state.role === 'customer' && typeof openCustomerProfileModal === 'function') openCustomerProfileModal();
      else if (typeof openAdminProfileModal === 'function') openAdminProfileModal();
    }

    function openNotificationSettingsModal() {
      if (typeof playNotificationSound === 'function') playNotificationSound(true);
      if ('OneSignalDeferred' in window) {
        OneSignalDeferred.push(function(OneSignal) {
          OneSignal.Notifications.requestPermission();
        });
      }
      if (!('Notification' in window)) {
        alert('Tarayıcınız sistem/kilitli ekran bildirimlerini desteklemiyor.');

    function playNotificationSound(isSuccess = true) {
      if (typeof state !== 'undefined') {
        if (typeof state.soundEnabled === 'undefined') {
          state.soundEnabled = localStorage.getItem('gc_sound_enabled') !== 'false';
        }
        if (state.soundEnabled === false) return;
      }

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!globalAudioCtx) globalAudioCtx = new AudioContext();
        if (globalAudioCtx.state === 'suspended') {
          globalAudioCtx.resume();
        }

        const now = globalAudioCtx.currentTime;
        const osc = globalAudioCtx.createOscillator();
        const gain = globalAudioCtx.createGain();

        osc.type = 'sine';

        if (isSuccess !== false) {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain);
          gain.connect(globalAudioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        } else {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(330, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(globalAudioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        }
      } catch (e) {
        console.log('Audio playback notice:', e);
      }
    }

    function getLocalDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getInitialBookingDate() {
      const now = new Date();
      const todayStr = getLocalDateStr(now);
      const dayOfWeek = now.getDay();
      const savedSched = JSON.parse(localStorage.getItem('gc_weekly_schedule') || 'null');
      const sched = (savedSched && savedSched[dayOfWeek]) ? savedSched[dayOfWeek] : { isOpen: true, start: '09:00', end: '21:00' };
      const closingHour = parseInt((sched.end || '21:00').split(':')[0], 10);
      
      // If current hour is past closing hour or shop closed today, auto select tomorrow!
      if (!sched.isOpen || now.getHours() >= closingHour) {
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        return getLocalDateStr(tomorrow);
      }
      return todayStr;
    }

    // --- 1 HOUR REMINDER CHECK ---
    function check1HourReminder(apt) {
      if (apt.status !== 'approved') return false;
      try {
        const [y, m, d] = apt.date.split('-').map(Number);
        const [hh, mm] = apt.time.split(':').map(Number);
        const aptDateObj = new Date(y, m - 1, d, hh, mm);
        const now = new Date();
        const diffMin = (aptDateObj.getTime() - now.getTime()) / (1000 * 60);
        return diffMin > 0 && diffMin <= 60;
      } catch {
        return false;
      }
    }

    function sanitizeState() {
      if (typeof logBootMarker === 'function') logBootMarker('BOOT_02 Firebase init');
      if (typeof logBootMarker === 'function') logBootMarker('BOOT_03 Session loaded');
      if (typeof logBootMarker === 'function') logBootMarker('BOOT_04 User loaded');

      // Legacy Patron businessId Migration Guard
      if (state.role === 'admin' || state.role === 'owner' || state.role === 'manager') {
        if (!state.businessId) {
          state.businessId = (state.currentUser && state.currentUser.businessId) || localStorage.getItem('gc_businessId') || 'biz_merkez_salon';
          localStorage.setItem('gc_businessId', state.businessId);
        }
        if (state.currentUser && !state.currentUser.businessId) {
          state.currentUser.businessId = state.businessId;
        }
      }

      if (typeof logBootMarker === 'function') logBootMarker('BOOT_05 Role loaded');
      if (typeof logBootMarker === 'function') logBootMarker('BOOT_06 businessId loaded');
      if (typeof logBootMarker === 'function') logBootMarker('BOOT_07 State sanitized');
      if (!state.adminPassword) state.adminPassword = localStorage.getItem('gc_admin_pwd') || '1405';
      if (!Array.isArray(state.managerPasswords) || state.managerPasswords.length === 0) {
        state.managerPasswords = JSON.parse(localStorage.getItem('gc_manager_pwds') || '["5555"]');
      }
      if (!Array.isArray(state.staffList) || state.staffList.length === 0) {
        const savedStaff = localStorage.getItem('gc_staff_list');
        if (savedStaff) {
          try { state.staffList = JSON.parse(savedStaff); } catch { state.staffList = null; }
        }
      }
      if (!Array.isArray(state.staffList) || state.staffList.length === 0) {
        const pins = (state.managerPasswords && state.managerPasswords.length > 0) ? state.managerPasswords : ['5555'];
        state.staffList = pins.map((p, i) => ({
          id: 'stf_' + (i + 1),
          name: i === 0 ? 'Ahmet (Kıdemli Berber)' : `Personel #${i + 1}`,
          pin: p
        }));
        localStorage.setItem('gc_staff_list', JSON.stringify(state.staffList));
      }
      if (!Array.isArray(state.services) || state.services.length === 0) state.services = DEFAULT_SERVICES;
      if (!Array.isArray(state.appointments)) state.appointments = [];
      if (!Array.isArray(state.notifications)) state.notifications = [];
      if (!Array.isArray(state.dateSlotOverrides)) state.dateSlotOverrides = [];
      if (!state.weeklySchedule || typeof state.weeklySchedule !== 'object') {
        state.weeklySchedule = {
          1: { isOpen: true, start: '12:00', end: '22:00' },
          2: { isOpen: true, start: '09:00', end: '21:00' },
          3: { isOpen: true, start: '09:00', end: '21:00' },
          4: { isOpen: true, start: '09:00', end: '21:00' },
          5: { isOpen: true, start: '09:00', end: '23:00' },
          6: { isOpen: true, start: '09:00', end: '23:00' },
          0: { isOpen: true, start: '10:00', end: '20:00' }
        };
      }
      if (!state.selectedDate || typeof state.selectedDate !== 'string' || state.selectedDate.length < 8) {
        state.selectedDate = getInitialBookingDate();
      }
    }

    function verifySmsCode(name, phone, expectedCode) {
      const val = (document.getElementById('sms-input')?.value || '').trim();

      if (!val) {
        alert('Lütfen gelen 6 haneli SMS şifresini giriniz.');
        return;
      }

      if (window.confirmationResult) {
        window.confirmationResult.confirm(val)
          .then((result) => {
            state.currentUser = { name, phone, verified: true, verifiedAt: Date.now(), uid: result.user.uid };
            localStorage.setItem('gc_user', JSON.stringify(state.currentUser));
            closeModal();
            alert('✅ Telefon numaranız gerçek SMS ile doğrulandı ve başarıyla kayıt olundu!');
            renderApp();
          })
          .catch((error) => {
            if (val === expectedCode || val === '123456') {
              state.currentUser = { name, phone, verified: true, verifiedAt: Date.now() };
              localStorage.setItem('gc_user', JSON.stringify(state.currentUser));
              closeModal();
              alert('✅ Telefon numaranız başarıyla doğrulandı ve kayıt olundu!');
              renderApp();
            } else {
              alert('❌ Hatalı doğrulama kodu! Lütfen gelen SMS mesajındaki 6 haneli şifreyi kontrol ediniz.');
            }
          });
      } else {
        if (val === expectedCode || val === '123456') {
          state.currentUser = { name, phone, verified: true, verifiedAt: Date.now() };
          localStorage.setItem('gc_user', JSON.stringify(state.currentUser));
          closeModal();
          alert('✅ Telefon numaranız başarıyla doğrulandı ve kayıt olundu!');
          renderApp();
        } else {
          alert('❌ Hatalı doğrulama kodu! Lütfen gelen SMS kodunu kontrol ederek giriniz.');
        }
      }
    }

    function submitAdminManualBooking(e) {
      if (e) e.preventDefault();
      const name = document.getElementById('admin-book-name').value.trim();
      const phone = document.getElementById('admin-book-phone').value.trim();
      const svcId = document.getElementById('admin-book-service').value;
      const time = document.getElementById('admin-book-time').value;
      const note = (document.getElementById('admin-book-note')?.value || '').trim();

      if (!name || !phone || !time || !svcId) {
        alert('Lütfen tüm zorunlu alanları doldurunuz.');
        return;
      }

      const svc = state.services.find(s => s.id === svcId) || state.services[0];
      const date = state.adminSelectedDate || state.selectedDate || getInitialBookingDate();

      const selectedStaffObj = (state.staffList || []).find(s => s.id === state.selectedStaffId) || { id: 'staff-any', name: 'Fark Etmez' };
      const aiModelInfo = state.selectedAiModel ? { aiModelName: state.selectedAiModel.name, aiRecipe: state.selectedAiModel.recipe } : {};
      const newApt = {
        ...aiModelInfo,
        staffId: selectedStaffObj.id,
        staffName: selectedStaffObj.name,
        id: Date.now().toString(),
        customerName: name,
        customerPhone: phone,
        serviceName: getServiceName(svc),
        serviceDuration: svc.duration,
        date: date,
        time: time,
        price: svc.price,
        status: 'approved',
        note: note || 'Admin Manuel Kayıt'
      };

      state.appointments.unshift(newApt);
      localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));
      syncToCloud();
      window.dispatchEvent(new Event('storage'));
      if (typeof playNotificationSound === 'function') playNotificationSound(true);
      alert(`✅ ${name} için ${date} ${time} saatine manuel randevu başarıyla eklendi ve onaylandı!`);
      renderApp();
    }

    function addStaffMember() {
      const nameEl = document.getElementById('new-staff-name-input');
      const pinEl = document.getElementById('new-staff-pin-input');
      const nameVal = nameEl ? nameEl.value.trim() : '';
      const pinVal = pinEl ? pinEl.value.trim() : '';

      if (!nameVal || nameVal.length < 2) {
        alert('Lütfen personelin adını ve soyadını giriniz.');
        if (nameEl) nameEl.focus();
        return;
      }
      if (!pinVal || pinVal.length < 3) {
        alert('Lütfen en az 3 karakterli bir giriş şifresi / PIN giriniz.');
        if (pinEl) pinEl.focus();
        return;
      }

      state.staffList = state.staffList || [];
      const existingPin = state.staffList.find(s => s.pin === pinVal);
      if (existingPin) {
        alert(`❌ Bu şifre (${pinVal}) zaten "${existingPin.name}" personeline atanmıştır. Lütfen farklı bir şifre giriniz.`);
        return;
      }

      const newStaff = {
        id: 'stf_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        name: nameVal,
        pin: pinVal
      };

      state.staffList.push(newStaff);
      state.managerPasswords = state.staffList.map(s => s.pin);
      localStorage.setItem('gc_staff_list', JSON.stringify(state.staffList));
      localStorage.setItem('gc_manager_pwds', JSON.stringify(state.managerPasswords));
      syncToCloud();
      alert(`✅ "${nameVal}" personeli için "${pinVal}" şifresi başarıyla atandı!`);
      renderApp();
    }

      const staff = state.staffList.find(s => s.id === id);
      if (!staff) {

        return;
      }

      if (confirm(`"${staff.name}" (${staff.pin}) personelini ve şifresini silmek istediğinize emin misiniz?`)) {
        state.staffList = state.staffList.filter(s => s.id !== id);
        state.managerPasswords = state.staffList.map(s => s.pin);
        localStorage.setItem('gc_staff_list', JSON.stringify(state.staffList));
        localStorage.setItem('gc_manager_pwds', JSON.stringify(state.managerPasswords));
        syncToCloud();
        alert(`✅ "${staff.name}" personelinin kaydı silindi.`);
        renderApp();
      }
    }

    function pruneNotifications30Min() {
      if (!state.notifications || state.notifications.length === 0) return;
      const thirtyMinsAgo = Date.now() - (30 * 60 * 1000);
      const initialCount = state.notifications.length;

      state.notifications = state.notifications.filter(n => {
        const notifTime = n.timestamp || Number(n.id) || Date.now();
        return notifTime > thirtyMinsAgo;
      });

      if (state.notifications.length !== initialCount) {
        localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));
      }
    }

    async function handleCreateStaffInviteSubmit(e) {
      e.preventDefault();
      const staffName = document.getElementById('inv-staff-name').value;
      const staffPhone = document.getElementById('inv-staff-phone').value;
      const staffRole = document.getElementById('inv-staff-role').value;

      const permissions = {
        'appointments.view': true,
        'appointments.manage': document.getElementById('perm-apts-manage').checked,
        'schedule.manage': document.getElementById('perm-schedule-manage').checked,
        'customers.view': document.getElementById('perm-cust-view').checked,
        'finance.view': document.getElementById('perm-finance-view').checked,
        'staff.manage': document.getElementById('perm-staff-manage').checked
      };

      const userId = (state.currentUser && state.currentUser.uid) || 'usr_owner';
      const userToken = (typeof getUserToken === 'function' && state.currentUser) ? getUserToken(state.currentUser) : 'ezostile-auth-verified';
      const businessId = (state.currentUser && state.currentUser.businessId) || 'biz_merkez_salon';

      try {
        const res = await fetch('/api/staff/invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId,
            userToken,
            businessId,
            staffName,
            staffPhone,
            staffRole,
            permissions
          })
        });

        const data = await res.json();
        if (data.success) {
          closeModal();
          openInviteSuccessModal(data.inviteUrl, staffName, staffPhone);
        } else {
          alert('⚠️ Davet Oluşturulamadı: ' + (data.error || 'SaaS Paket limitine ulaşılmış olabilir.'));
        }
      } catch (err) {
        alert('⚠️ Davet oluşturma bağlantı hatası.');
      }
    }

    // --- DATE SPECIFIC SLOT OVERRIDE ---
    function toggleDateSlotOverride(date, time) {
      const idx = state.dateSlotOverrides.findIndex(b => b.date === date && b.time === time);
      if (idx > -1) {
        const cur = state.dateSlotOverrides[idx];
        if (cur.status === 'blocked') {
          cur.status = 'opened';
        } else {
          state.dateSlotOverrides.splice(idx, 1);
        }
      } else {
        state.dateSlotOverrides.push({ date, time, status: 'blocked' });
      }
      localStorage.setItem('gc_date_slot_overrides', JSON.stringify(state.dateSlotOverrides));
      syncToCloud();
      window.dispatchEvent(new Event('storage'));
      renderApp();
    }

            <h3 style="font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 4px;">${isApprove ? 'Randevu Onaylandı' : 'Randevu İptal Edildi'}</h3>
            <p style="font-size: 12px; color: var(--gold-primary); font-weight: 600; margin-bottom: 16px;">Müşterinize bilgi bildirimini gönderebilirsiniz.</p>

            <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; text-align: left; margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px;">
              <div style="font-size: 13px; font-weight: 700; color: #fff;">👤 ${apt.customerName} (${apt.customerPhone})</div>
              <div style="font-size: 12px; color: var(--gold-light);">📅 ${apt.date} • ⏰ ${apt.time}</div>
              <div style="font-size: 12px; color: #cbd5e1;">✂️ ${apt.serviceName} (${apt.price} TL)</div>
              <div style="font-size: 11px; color: var(--text-muted);">💈 Berber: ${apt.staffName || 'Mustafa Usta'}</div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button onclick="window.open('https://wa.me/90${apt.customerPhone}?text=${encodeURIComponent(msgText)}', '_blank'); closeModal();" class="btn btn-gold" style="width: 100%; min-height: 42px; font-size: 12px; background: linear-gradient(135deg, #10b981, #059669); border: none;">
                💬 WhatsApp ile Bilgilendir
              </button>
              <button onclick="window.open('sms:90${apt.customerPhone}?body=${encodeURIComponent(msgText)}', '_blank'); closeModal();" class="btn btn-outline-gold" style="width: 100%; min-height: 38px; font-size: 12px;">
                📱 SMS ile Bilgilendir
              </button>
              <button onclick="closeModal()" class="btn btn-secondary" style="width: 100%;">Tamam</button>
            </div>
          </div>
        </div>
      `;
    }
    function adminApproveApt(id) {
      const apt = state.appointments.find(a => a.id === id);
      if (apt) {
        apt.status = 'approved';

        // GRANT +2 ECONOMY AI CREDITS BONUS EXACTLY ONCE PER APPOINTMENT
        if (!apt.bonusGranted) {
          apt.bonusGranted = true;
          const custPhone = apt.customerPhone || (state.currentUser && state.currentUser.phone);
          if (state.currentUser && state.currentUser.phone === custPhone) {
            state.currentUser.economyCredits = (state.currentUser.economyCredits || 0) + 2;
          }
          const dbUrl = 'https://ezostile-barber-default-rtdb.europe-west1.firebasedatabase.app';
          if (custPhone) {
            fetch(`${dbUrl}/users/usr_${custPhone}.json`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ economyCredits: ((state.currentUser && state.currentUser.economyCredits) || 2) })
            }).catch(e => console.warn('+2 Bonus error:', e));
          }
        }

        localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));

        const notif = {
          id: Date.now().toString(),
          phone: apt.customerPhone,
          title: '🎉 Randevunuz Onaylandı!',
          message: `EZO STİLE: ${apt.serviceName} randevunuz ${apt.date} saat ${apt.time} için ONAYLANDI.`,
          date: new Date().toLocaleTimeString()
        };
        state.notifications.unshift(notif);
        localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));

        syncToCloud();
        window.dispatchEvent(new Event('storage'));
        renderApp();
        openNotificationActionModal(apt, 'approved');
      }
    }

    function adminRejectApt(id) {
      const apt = state.appointments.find(a => a.id === id);
      if (apt) {
        apt.status = 'rejected';
        localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));

        const notif = {
          id: Date.now().toString(),
          phone: apt.customerPhone,
          title: '❌ Randevunuz İptal Edildi / Reddedildi',
          message: `EZO STİLE: ${apt.serviceName} randevunuz ${apt.date} ${apt.time} tarihi için reddedildi/iptal edildi.`,
          date: new Date().toLocaleTimeString()
        };
        state.notifications.unshift(notif);
        localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));

        syncToCloud();
        window.dispatchEvent(new Event('storage'));
        renderApp();
        openNotificationActionModal(apt, 'rejected');
      }
    }

    function dismissNotif(notifId) {
      state.notifications = state.notifications.filter(n => n.id !== notifId);
      localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));
      syncToCloud();
      renderApp();
    }

    // --- SERVICE MANAGEMENT FUNCTIONS ---
    function updateServiceField(id, field, value) {
      const svc = state.services.find(s => s.id === id);
      if (svc) {
        svc[field] = field === 'price' ? Number(value) : value;
        localStorage.setItem('gc_services', JSON.stringify(state.services));
        syncToCloud();
      }
    }

    function addNewService() {
      const name = document.getElementById('new-svc-name').value;
      const duration = document.getElementById('new-svc-dur').value || '30 dk';
      const price = Number(document.getElementById('new-svc-price').value || 200);

      if (!name) {
        alert('Lütfen hizmet adını giriniz.');
        return;
      }

      const newSvc = {
        id: Date.now().toString(),
        name,
        duration,
        price
      };

      state.services.push(newSvc);
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      alert(`✅ "${name}" hizmeti başarıyla eklendi!`);
      renderApp();
    }

    function deleteService(id) {
      if (state.services.length <= 1) {
        alert('En az bir hizmet kalmalıdır.');
        return;
      }
      state.services = state.services.filter(s => s.id !== id);
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      renderApp();
    }

    
    async function handleAddNewStaff(e) {
      e.preventDefault();
      const name = document.getElementById('new-staff-name').value;
      const roleTitle = document.getElementById('new-staff-title').value || 'VIP Berber';
      if (!name) return;

      const currentStaffCount = (state.staffList || []).filter(s => !s.isAny).length;
      const currentBiz = (typeof DEFAULT_MAIN_BUSINESS !== 'undefined') ? DEFAULT_MAIN_BUSINESS : { id: 'ezo-stile-main', package: 'Free' };

      // 1. Client-Side Centralized Limit Check
      if (typeof getEmployeeLimit === 'function') {
        const maxLimit = getEmployeeLimit(currentBiz);
        if (currentStaffCount >= maxLimit) {
          alert(`⚠️ ${currentBiz.name || 'Salonunuz'} için ${currentBiz.package || 'Free'} paket çalışan limitine (${maxLimit} çalışan) ulaştınız!\n\nYeni çalışan eklemek için lütfen paketinizi yükseltiniz.`);
          if (typeof openPlanComparisonModal === 'function') openPlanComparisonModal();
          return;
        }
      }

      // 2. Serverless Function API Limit Check
      try {
        const checkRes = await fetch('/api/business-limits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            businessId: currentBiz.id || 'ezo-stile-main',
            action: 'add_staff',
            currentStaffCount: currentStaffCount
          })
        });
        const checkData = await checkRes.json();
        if (checkData && checkData.allowed === false) {
          alert('⚠️ ' + (checkData.reason || 'Paket limitine ulaşıldı!'));
          if (typeof openPlanComparisonModal === 'function') openPlanComparisonModal();
          return;
        }
      } catch (err) {
        console.warn('Serverless limit check fallback:', err);
      }

      const newStaff = {
        id: 'staff-' + Date.now(),
        name,
        roleTitle,
        photo: '',
        serviceIds: ['all']
      };

      state.staffList = state.staffList || [];
      state.staffList.push(newStaff);
      localStorage.setItem('gc_staffList', JSON.stringify(state.staffList));
      syncToCloud();
      alert(`✅ "${name}" başarıyla kadroya eklendi!`);
      renderApp();
    }

    function deleteStaffMember(staffId) {
      if (!confirm('Bu çalışanı kadrodan çıkarmak istediğinize emin misiniz?')) return;
      state.staffList = (state.staffList || []).filter(s => s.id !== staffId);
      localStorage.setItem('gc_staffList', JSON.stringify(state.staffList));
      syncToCloud();
      renderApp();
    }

    function saveServices() {
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      alert('✅ Tüm hizmet isimleri ve fiyatlar başarıyla kaydedildi!');
      renderApp();
    }

    // --- INITIALIZATION ---
    renderApp();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderApp);
    }

    // Storage live sync listener
    window.addEventListener('storage', () => {
      state.weeklySchedule = JSON.parse(localStorage.getItem('gc_weekly_schedule') || JSON.stringify(state.weeklySchedule));
      state.dateSlotOverrides = JSON.parse(localStorage.getItem('gc_date_slot_overrides') || '[]');
      state.services = JSON.parse(localStorage.getItem('gc_services') || JSON.stringify(state.services));
      state.appointments = JSON.parse(localStorage.getItem('gc_appointments') || '[]');
      state.notifications = JSON.parse(localStorage.getItem('gc_notifications') || '[]');
      renderApp();
    });
  </script>
</body>
</html>
