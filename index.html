  <style>
    /* VIP EZO STİLE DESIGN SYSTEM & CSS TOKENS */
    :root {
      --bg-dark: #070c1a;
      --bg-card: #0f172a;
      --bg-card-hover: #1e293b;
      --gold-primary: #f59e0b;
      --gold-light: #fbbf24;
      --gold-dark: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --emerald: #10b981;
      --rose: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* Utility Classes */
    .container { width: 100%; max-width: 920px; margin: 0 auto; padding: 16px; }
    .gold-gradient-text { background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-btn { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); color: #070c1a; font-weight: 800; border: none; padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25); text-decoration: none; font-size: 12px; }
    .gold-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4); }
    .gold-btn:active { transform: translateY(0); }
    
    .card { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .input-field { width: 100%; background: #070c1a; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: var(--gold-primary); }

    /* Logo sharp styling */
    .logo-box { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid var(--gold-primary); box-shadow: 0 0 15px rgba(245,158,11,0.3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .logo-box img { width: 100%; height: 100%; object-fit: cover; }

    /* Header & Footer */
    header { background: rgba(7, 12, 26, 0.95); border-bottom: 1px solid var(--border-color); padding: 14px 20px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .header-content { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    footer { margin-top: auto; border-top: 1px solid var(--border-color); padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; background: #040711; }

    /* Animations */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* Badges */
    .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .badge-approved { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rejected { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Slot Grid */
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-top: 12px; }
    .slot-btn { padding: 10px 4px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); background: #070c1a; color: var(--text-main); cursor: pointer; text-align: center; transition: all 0.15s; }
    .slot-btn.selected { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; border-color: #f59e0b; transform: scale(1.05); }
    .slot-btn.disabled, .slot-btn.past { opacity: 0.3; cursor: not-allowed !important; text-decoration: line-through; border-color: #1e293b; background: rgba(15, 23, 42, 0.4); pointer-events: none; }
    .slot-btn.blocked { background: rgba(244, 63, 94, 0.2); color: #fb7185; border-color: rgba(244, 63, 94, 0.4); }
    .slot-btn.opened { background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: rgba(16, 185, 129, 0.4); }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-content { background: #0f172a; border: 1px solid var(--gold-primary); border-radius: 24px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

    /* Notification Toast */
    .notif-box { background: rgba(15, 23, 42, 0.95); border: 1px solid var(--gold-primary); padding: 12px 16px; border-radius: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }

    function getLocalDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getInitialBookingDate() {
      const now = new Date();
      const todayStr = getLocalDateStr(now);
      const dayOfWeek = now.getDay();
      const savedSched = JSON.parse(localStorage.getItem('gc_weekly_schedule') || 'null');
      const sched = (savedSched && savedSched[dayOfWeek]) ? savedSched[dayOfWeek] : { isOpen: true, start: '09:00', end: '21:00' };
      const closingHour = parseInt((sched.end || '21:00').split(':')[0], 10);
      
      // If current hour is past closing hour or shop closed today, auto select tomorrow!
      if (!sched.isOpen || now.getHours() >= closingHour) {
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        return getLocalDateStr(tomorrow);
      }
      return todayStr;
    }

    // --- APP STATE ---
    let state = {
      language: localStorage.getItem('gc_lang') || 'tr',
      role: 'customer', // 'customer' | 'admin' | 'manager'
      currentUser: JSON.parse(localStorage.getItem('gc_user') || 'null'),
      smsCode: null,
      adminTab: 'requests', // 'weeklySchedule' | 'slotLocking' | 'servicesAdmin' | 'requests'
      requestsSubTab: 'pending', // 'pending' | 'approved' | 'rejected'
      services: JSON.parse(localStorage.getItem('gc_services') || JSON.stringify(DEFAULT_SERVICES)),
      selectedServiceId: '1',
      selectedDate: getInitialBookingDate(),
      selectedTime: '',
      weeklySchedule: JSON.parse(localStorage.getItem('gc_weekly_schedule') || JSON.stringify({
        1: { isOpen: true, start: '12:00', end: '22:00' },
        2: { isOpen: true, start: '09:00', end: '21:00' },
        3: { isOpen: true, start: '09:00', end: '21:00' },
        4: { isOpen: true, start: '09:00', end: '21:00' },
        5: { isOpen: true, start: '09:00', end: '23:00' },
        6: { isOpen: true, start: '09:00', end: '23:00' },
        0: { isOpen: true, start: '10:00', end: '20:00' }
      })),
      dateSlotOverrides: JSON.parse(localStorage.getItem('gc_date_slot_overrides') || '[]'),
      notifications: JSON.parse(localStorage.getItem('gc_notifications') || '[]'),
      appointments: JSON.parse(localStorage.getItem('gc_appointments') || JSON.stringify([
        { id: '101', customerName: 'Ahmet Yılmaz', customerPhone: '05321112233', serviceName: 'Saç Kesimi & Yıkama & Şekillendirme', date: new Date().toISOString().split('T')[0], time: '14:00', price: 250, status: 'approved' }
      ]))
    };

    function t(key) {
      const dict = TRANSLATIONS[state.language] || TRANSLATIONS.tr;
      return dict[key] || TRANSLATIONS.tr[key] || key;
    }

    function getServiceName(svc) {
      if (svc.id && TRANSLATIONS[state.language]?.services?.[svc.id]) {
        return TRANSLATIONS[state.language].services[svc.id];
      }
      return svc.name;
    }

    function setLanguage(lang) {
      state.language = lang;
      localStorage.setItem('gc_lang', lang);
      document.getElementById('btn-staff-login').innerText = t('staffLogin');
      document.getElementById('btn-back-customer').innerText = t('backToCustomer');
      renderApp();
    }

    function switchRole(role) {
      state.role = role;
      document.getElementById('footer-staff-link').style.display = role === 'customer' ? 'block' : 'none';
      document.getElementById('footer-back-link').style.display = role !== 'customer' ? 'block' : 'none';
      const badge = document.getElementById('role-badge');
      if (role !== 'customer') {
        badge.innerText = role === 'admin' ? '👑 Admin' : '🛠️ Yönetici';
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
      renderApp();
    }

    // --- 1 HOUR REMINDER CHECK ---
    function check1HourReminder(apt) {
      if (apt.status !== 'approved') return false;
      try {
        const [y, m, d] = apt.date.split('-').map(Number);
        const [hh, mm] = apt.time.split(':').map(Number);
        const aptDateObj = new Date(y, m - 1, d, hh, mm);
        const now = new Date();
        const diffMin = (aptDateObj.getTime() - now.getTime()) / (1000 * 60);
        return diffMin > 0 && diffMin <= 60;
      } catch {
        return false;
      }
    }

    // --- MAIN RENDERER ---
    function renderApp() {
      const main = document.getElementById('main-app');
      document.getElementById('header-subtitle').innerText = t('subtitle');
      document.getElementById('btn-staff-login').innerText = t('staffLogin');
      document.getElementById('btn-back-customer').innerText = t('backToCustomer');
      
      if (state.role === 'customer') {
        renderCustomerView(main);
      } else {
        renderAdminView(main);
      }
    }

    // --- CUSTOMER VIEW ---
    function renderCustomerView(container) {
      // IF CUSTOMER IS NOT REGISTERED YET: SHOW ONLY REGISTRATION CARD
      if (!state.currentUser) {
        container.innerHTML = `
          <div class="card" style="border-color: var(--gold-primary); max-width: 480px; margin: 40px auto; text-align: center; padding: 30px;">
            <div style="width: 70px; height: 70px; margin: 0 auto 16px; border-radius: 20px; background: #000; border: 2px solid var(--gold-primary); overflow: hidden;">
              <img src="/insta.png" onerror="this.onerror=null; this.src='insta.png';" style="width: 100%; height: 100%; object-fit: cover;" alt="Logo">
            </div>
            <h2 style="font-size: 20px; font-weight: 900; color: var(--gold-primary); margin-bottom: 8px;">${t('custLoginTitle')}</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">${t('custLoginDesc')}</p>
            
            <form onsubmit="handleCustomerRegister(event)" style="display: flex; flex-direction: column; gap: 12px;">
              <input id="reg-name" required type="text" placeholder="Adınız Soyadınız" class="input-field" style="padding: 14px; font-size: 14px;">
              <input id="reg-phone" required type="tel" placeholder="Telefon Numaranız (05XX...)" class="input-field" style="padding: 14px; font-size: 14px;">
              <button type="submit" class="gold-btn" style="padding: 16px; font-size: 14px; margin-top: 4px;">
                ${t('custLoginBtn')}
              </button>
            </form>
          </div>
        `;
        return;
      }

      // REGISTERED CUSTOMER VIEW: SHOW DIRECT BOOKING WIZARD & MY APPOINTMENTS
      const myApts = state.appointments.filter(a => a.customerPhone === state.currentUser.phone);
      const myNotifs = state.notifications.filter(n => n.phone === state.currentUser.phone);
      const upcoming1h = myApts.find(check1HourReminder);

      // Check weekly schedule for selected date
      const parts = state.selectedDate.split('-');
      const dObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      const dayOfWeek = dObj.getDay();
      const sched = state.weeklySchedule[dayOfWeek] || { isOpen: true, start: '09:00', end: '21:00' };

      // Generate time slots
      const startHour = parseInt((sched.start || '09:00').split(':')[0]);
      const endHour = parseInt((sched.end || '21:00').split(':')[0]);
      const availableSlots = [];
      if (sched.isOpen) {
        for (let h = startHour; h <= endHour; h++) {
          const hh = h.toString().padStart(2, '0');
          availableSlots.push(`${hh}:00`);
          if (h !== endHour) availableSlots.push(`${hh}:30`);
        }
      }

      // Add custom opened slots for this specific date
      state.dateSlotOverrides.filter(o => o.date === state.selectedDate && o.status === 'opened').forEach(o => {
        if (!availableSlots.includes(o.time)) availableSlots.push(o.time);
      });
      availableSlots.sort();

      // Local date calculations
      const now = new Date();
      const todayStr = getLocalDateStr(now);
      const isToday = state.selectedDate === todayStr;
      const isPastDate = state.selectedDate < todayStr;
      const currentHour = now.getHours();
      const currentMin = now.getMinutes();

      // Check if all slots for today are in the past
      let allPastForToday = false;
      if (isToday && availableSlots.length > 0) {
        allPastForToday = availableSlots.every(time => {
          const [sHour, sMin] = time.split(':').map(Number);
          return sHour < currentHour || (sHour === currentHour && sMin <= currentMin);
        });
      }

      const activeSelectedService = state.services.find(s => s.id === state.selectedServiceId) || state.services[0] || DEFAULT_SERVICES[0];

      let html = '';

      // LOGGED IN USER BAR
      html += `
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px;">
          <div>
            <span style="font-size: 11px; color: var(--text-muted);">Hoş Geldiniz:</span>
            <div style="font-weight: 800; font-size: 14px; color: #fff;">👤 ${state.currentUser.name} <span style="font-size: 12px; color: var(--gold-primary);">(${state.currentUser.phone})</span></div>
          </div>
          <button onclick="logoutCustomer()" style="background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3); color: #fb7185; padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer;">🚪 Çıkış Yap</button>
        </div>
      `;

      // CUSTOMER NOTIFICATIONS TOASTS
      if (myNotifs.length > 0) {
        html += `<div style="margin-bottom: 12px;">`;
        myNotifs.forEach(n => {
          html += `
            <div class="notif-box">
              <div>
                <strong style="color: var(--gold-primary);">${n.title}</strong>
                <div style="color: #fff; margin-top: 2px;">${n.message}</div>
              </div>
              <button onclick="dismissNotif('${n.id}')" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 800;">✕</button>
            </div>
          `;
        });
        html += `</div>`;
      }

      // 1-HOUR REMINDER BANNER
      if (upcoming1h) {
        html += `
          <div class="reminder-banner animate-pulse">
            <div>
              <div style="font-weight: 900; font-size: 13px; color: #fbbf24; text-transform: uppercase;">${t('reminderTitle')}</div>
              <div style="font-size: 12px; margin-top: 2px;">${t('reminderDesc')}</div>
              <div style="font-size: 12px; font-weight: 800; color: #fff; margin-top: 4px;">📌 ${upcoming1h.serviceName} — ⏰ ${upcoming1h.date} ${upcoming1h.time}</div>
            </div>
            <button onclick="Notification.requestPermission()" class="gold-btn" style="padding: 8px 12px; font-size: 11px;">${t('enableNotifications')}</button>
          </div>
        `;
      }

      // BOOKING WIZARD CARD (DIRECT ACCESS)
      html += `
        <div class="card">
          <!-- 1. SERVICE SELECT -->
          <h3 style="font-size: 14px; font-weight: 800; color: var(--gold-primary); margin-bottom: 12px;">${t('servicesTitle')}</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 20px;">
            ${state.services.map(s => {
              const displayName = getServiceName(s);
              return `
                <div onclick="selectService('${s.id}')" style="padding: 12px; border-radius: 14px; border: 1px solid ${activeSelectedService.id === s.id ? 'var(--gold-primary)' : 'var(--border-color)'}; background: ${activeSelectedService.id === s.id ? 'rgba(245,158,11,0.1)' : '#070c1a'}; cursor: pointer; transition: all 0.2s;">
                  <div style="font-weight: 700; font-size: 13px; color: #fff;">${displayName}</div>
                  <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; font-weight: 800;">
                    <span style="color: var(--text-muted);">${s.duration}</span>
                    <span style="color: var(--gold-primary);">${s.price} TL</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- 2. DATE SELECT -->
          <h3 style="font-size: 14px; font-weight: 800; color: var(--gold-primary); margin-bottom: 10px;">${t('dateTitle')}</h3>
          <input type="date" value="${state.selectedDate}" min="${todayStr}" onchange="selectDate(this.value)" class="input-field" style="margin-bottom: 16px;">

          <!-- 3. TIME SELECT -->
          <h3 style="font-size: 14px; font-weight: 800; color: var(--gold-primary); margin-bottom: 10px;">${t('timeTitle')}</h3>
          
          ${!sched.isOpen ? `
            <div style="background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3); color: #fb7185; padding: 14px; border-radius: 14px; font-size: 13px; font-weight: 700; text-align: center;">
              ⚠️ Bu tarihte (${state.selectedDate}) salonumuz kapalıdır. Lütfen başka bir gün seçiniz.
            </div>
          ` : allPastForToday ? `
            <div style="background: rgba(245,158,11,0.15); border: 1px solid var(--gold-primary); color: #fbbf24; padding: 14px; border-radius: 14px; font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 16px;">
              ℹ️ Bugünün mesai saatleri (${sched.start} - ${sched.end}) tamamlanmıştır. Yarın veya gelecek bir tarih için randevu alabilirsiniz.
              <div style="margin-top: 10px;">
                <button onclick="selectTomorrow()" class="gold-btn" style="width: 100%; padding: 12px; font-size: 13px; font-weight: 900;">📅 Yarınki Saatleri Göster</button>
              </div>
            </div>
          ` : `
            <div class="slot-grid">
              ${availableSlots.map(time => {
                const override = state.dateSlotOverrides.find(b => b.date === state.selectedDate && b.time === time);
                const alreadyBooked = state.appointments.some(apt => 
                  apt.date === state.selectedDate && 
                  apt.time === time && 
                  apt.status !== 'rejected' && 
                  apt.status !== 'cancelled'
                );
                const isBlocked = (override ? override.status === 'blocked' : false) || alreadyBooked;
                const isSelected = state.selectedTime === time;

                // Past hour calculation ONLY for today
                let isPast = false;
                if (isToday) {
                  const [sHour, sMin] = time.split(':').map(Number);
                  if (sHour < currentHour || (sHour === currentHour && sMin <= currentMin)) {
                    isPast = true;
                  }
                } else if (isPastDate) {
                  isPast = true;
                }

                const isDisabled = isBlocked || isPast;

                return `
                  <button onclick="selectTime('${time}')" ${isDisabled ? 'disabled' : ''} class="slot-btn ${isPast ? 'past' : ''} ${isBlocked ? 'blocked' : ''} ${isSelected ? 'selected' : ''}">
                    ${time}
                    ${isPast ? '<span style="display:block; font-size:8px; opacity:0.6;">⏳ GEÇTİ</span>' : alreadyBooked ? '<span style="display:block; font-size:8px; color:#fb7185;">🔒 DOLU</span>' : isBlocked ? '<span style="display:block; font-size:8px; color:#fb7185;">🔒 KAPALI</span>' : ''}
                  </button>
                `;
              }).join('')}
            </div>
          `}

          <!-- SUBMIT BUTTON -->
          <button onclick="submitBooking()" class="gold-btn" style="width: 100%; margin-top: 20px; padding: 16px; font-size: 15px;">
            ${t('bookBtn')}
          </button>
        </div>
      `;

      // MY APPOINTMENTS CARD WITH CANCEL & RESCHEDULE BUTTONS
      html += `
        <div class="card">
          <h3 style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 14px;">${t('myAppointments')} (${myApts.length})</h3>
          ${myApts.length === 0 ? `
            <p style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 20px;">Henüz verilmiş bir randevunuz bulunmamaktadır.</p>
          ` : `
            <div style="display: flex; flex-direction: column; gap: 12px;">
              ${myApts.map(a => {
                const is1h = check1HourReminder(a);
                const statusText = a.status === 'approved' ? t('statusApprovedText') : a.status === 'rejected' ? t('statusRejectedText') : a.status === 'cancelled' ? t('statusCancelledText') : t('statusPendingText');
                const canModify = a.status !== 'cancelled' && a.status !== 'rejected';
                
                return `
                  <div style="background: #070c1a; padding: 14px; border-radius: 14px; border: 1px solid ${is1h ? 'var(--gold-primary)' : 'var(--border-color)'}; display: flex; flex-direction: column; gap: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                      <div>
                        <div style="font-weight: 800; font-size: 14px; color: #fff;">${a.serviceName}</div>
                        <div style="font-size: 12px; color: var(--gold-primary); font-weight: 700; margin-top: 2px;">📅 ${a.date} — ⏰ ${a.time} (${a.price} TL)</div>
                        ${is1h ? `<span class="badge badge-pending animate-pulse" style="margin-top: 4px;">${t('reminderBadge')}</span>` : ''}
                      </div>
                      <div>
                        <span class="badge ${a.status === 'approved' ? 'badge-approved' : a.status === 'rejected' || a.status === 'cancelled' ? 'badge-rejected' : 'badge-pending'}">
                          ${statusText}
                        </span>
                      </div>
                    </div>

                    ${canModify ? `
                      <div style="display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 2px;">
                        <button onclick="openRescheduleModal('${a.id}')" class="gold-btn" style="padding: 6px 12px; font-size: 11px; background: rgba(245,158,11,0.15); color: var(--gold-primary); border: 1px solid rgba(245,158,11,0.3);">✏️ Saati / Tarihi Değiştir</button>
                        <button onclick="cancelMyAppointment('${a.id}')" style="background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3); color: #fb7185; padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer;">❌ Randevuyu İptal Et</button>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;

      container.innerHTML = html;
    }

    // --- ADMIN VIEW ---
    function renderAdminView(container) {
      const pendingApts = state.appointments.filter(a => a.status === 'pending');
      const approvedApts = state.appointments.filter(a => a.status === 'approved');
      const rejectedApts = state.appointments.filter(a => a.status === 'rejected' || a.status === 'cancelled');

      let html = `
        <div class="card" style="border-color: var(--gold-primary);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 style="font-size: 18px; font-weight: 900; color: var(--gold-primary);">${t('adminPanel')}</h2>
            <div style="display: flex; gap: 6px;">
              <button onclick="fetchFromCloud(); alert('✅ Canlı bulut verileri başarıyla yenilendi!');" style="background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #34d399; padding: 8px 12px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer;">🔄 Canlı Yenile</button>
              <button onclick="switchRole('customer')" style="background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: var(--gold-primary); padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer;">${t('backToCustomer')}</button>
            </div>
          </div>

          <!-- MAIN TABS -->
          <div style="display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; overflow-x: auto;">
            <button onclick="setAdminTab('requests')" class="gold-btn" style="padding: 8px 12px; font-size: 11px; background: ${state.adminTab === 'requests' ? 'linear-gradient(135deg,#fbbf24,#f59e0b)' : '#070c1a'}; color: ${state.adminTab === 'requests' ? '#000' : '#fff'}; border: 1px solid var(--border-color); flex-shrink: 0;">
              ${t('requests')} (${pendingApts.length})
            </button>
            <button onclick="setAdminTab('weeklySchedule')" class="gold-btn" style="padding: 8px 12px; font-size: 11px; background: ${state.adminTab === 'weeklySchedule' ? 'linear-gradient(135deg,#fbbf24,#f59e0b)' : '#070c1a'}; color: ${state.adminTab === 'weeklySchedule' ? '#000' : '#fff'}; border: 1px solid var(--border-color); flex-shrink: 0;">
              ${t('weeklySchedule')}
            </button>
            <button onclick="setAdminTab('slotLocking')" class="gold-btn" style="padding: 8px 12px; font-size: 11px; background: ${state.adminTab === 'slotLocking' ? 'linear-gradient(135deg,#fbbf24,#f59e0b)' : '#070c1a'}; color: ${state.adminTab === 'slotLocking' ? '#000' : '#fff'}; border: 1px solid var(--border-color); flex-shrink: 0;">
              ${t('slotLocking')}
            </button>
            <button onclick="setAdminTab('servicesAdmin')" class="gold-btn" style="padding: 8px 12px; font-size: 11px; background: ${state.adminTab === 'servicesAdmin' ? 'linear-gradient(135deg,#fbbf24,#f59e0b)' : '#070c1a'}; color: ${state.adminTab === 'servicesAdmin' ? '#000' : '#fff'}; border: 1px solid var(--border-color); flex-shrink: 0;">
              ${t('servicesAdmin')}
            </button>
          </div>
      `;

      // REQUESTS TAB WITH SEPARATE SUB-TABS FOR PENDING, APPROVED, REJECTED
      if (state.adminTab === 'requests') {
        html += `
          <div>
            <!-- SUB-TABS: BEKLEYENLER / ONAYLANANLAR / REDDEDİLENLER -->
            <div style="display: flex; gap: 6px; margin-bottom: 16px; background: #070c1a; padding: 4px; border-radius: 14px; border: 1px solid var(--border-color);">
              <button onclick="setRequestsSubTab('pending')" style="flex: 1; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 800; border: none; cursor: pointer; background: ${state.requestsSubTab === 'pending' ? 'var(--gold-primary)' : 'transparent'}; color: ${state.requestsSubTab === 'pending' ? '#000' : '#94a3b8'};">
                ${t('tabPending')} (${pendingApts.length})
              </button>
              <button onclick="setRequestsSubTab('approved')" style="flex: 1; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 800; border: none; cursor: pointer; background: ${state.requestsSubTab === 'approved' ? '#10b981' : 'transparent'}; color: ${state.requestsSubTab === 'approved' ? '#000' : '#94a3b8'};">
                ${t('tabApproved')} (${approvedApts.length})
              </button>
              <button onclick="setRequestsSubTab('rejected')" style="flex: 1; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 800; border: none; cursor: pointer; background: ${state.requestsSubTab === 'rejected' ? '#f43f5e' : 'transparent'}; color: ${state.requestsSubTab === 'rejected' ? '#fff' : '#94a3b8'};">
                ${t('tabRejected')} (${rejectedApts.length})
              </button>
            </div>
        `;

        const activeList = state.requestsSubTab === 'pending' ? pendingApts : state.requestsSubTab === 'approved' ? approvedApts : rejectedApts;

        if (activeList.length === 0) {
          html += `<p style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 20px;">Bu kategoride randevu bulunmamaktadır.</p>`;
        } else {
          html += `<div style="display: flex; flex-direction: column; gap: 10px;">`;
          activeList.forEach(a => {
            html += `
              <div style="background: #070c1a; padding: 14px; border-radius: 14px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">

    // --- 100% BULLETPROOF CORS-SAFE MULTI-DEVICE CLOUD SYNC ENGINE ---
    const CLOUD_SYNC_URL = 'https://api.myjson.online/v1/records/ezostile_app_2026';
    const FALLBACK_SYNC_URL = 'https://kvdb.io/A8Z9X1W2Q3V4M5N6P7R8/ezostile_app_2026';
    let isSyncingCloud = false;

    async function syncToCloud() {
      const payload = {
        appointments: state.appointments,
        dateSlotOverrides: state.dateSlotOverrides,
        weeklySchedule: state.weeklySchedule,
        services: state.services,
        notifications: state.notifications,
        updatedAt: Date.now()
      };

      const bodyStr = JSON.stringify(payload);

      try {
        await fetch(CLOUD_SYNC_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: bodyStr
        });
      } catch (e1) {
        try {
          await fetch(FALLBACK_SYNC_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: bodyStr
          });
        } catch (e2) {}
      }
    }

    async function fetchFromCloud() {
      if (isSyncingCloud) return;
      try {
        isSyncingCloud = true;
        let data = null;

        try {
          const res = await fetch(CLOUD_SYNC_URL);
          if (res.ok) {
            const json = await res.json();
            data = json.data || json;
          }
        } catch (e) {}

        if (!data || !data.updatedAt) {
          try {
            const res2 = await fetch(FALLBACK_SYNC_URL);
            if (res2.ok) {
              data = await res2.json();
            }
          } catch (e) {}
        }

        if (data && data.updatedAt) {
          let changed = false;

          if (data.appointments && JSON.stringify(data.appointments) !== JSON.stringify(state.appointments)) {
            state.appointments = data.appointments;
            localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));
            changed = true;
          }
          if (data.dateSlotOverrides && JSON.stringify(data.dateSlotOverrides) !== JSON.stringify(state.dateSlotOverrides)) {
            state.dateSlotOverrides = data.dateSlotOverrides;
            localStorage.setItem('gc_date_slot_overrides', JSON.stringify(state.dateSlotOverrides));
            changed = true;
          }
          if (data.weeklySchedule && JSON.stringify(data.weeklySchedule) !== JSON.stringify(state.weeklySchedule)) {
            state.weeklySchedule = data.weeklySchedule;
            localStorage.setItem('gc_weekly_schedule', JSON.stringify(state.weeklySchedule));
            changed = true;
          }
          if (data.services && JSON.stringify(data.services) !== JSON.stringify(state.services)) {
            state.services = data.services;
            localStorage.setItem('gc_services', JSON.stringify(state.services));
            changed = true;
          }
          if (data.notifications && JSON.stringify(data.notifications) !== JSON.stringify(state.notifications)) {
            state.notifications = data.notifications;
            localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));
            changed = true;
          }

          if (changed) {
            renderApp();
          }
        }
      } catch (err) {
        // Silent catch
      } finally {
        isSyncingCloud = false;
      }
    }

    // Initial fetch from cloud DB and auto poll every 2 seconds for instant multi-device sync
    fetchFromCloud();
    setInterval(fetchFromCloud, 2000);

    function toggleDateSlotOverride(date, time) {
      const idx = state.dateSlotOverrides.findIndex(b => b.date === date && b.time === time);

        const cur = state.dateSlotOverrides[idx];
        if (cur.status === 'blocked') {
          cur.status = 'opened';
        } else {
          state.dateSlotOverrides.splice(idx, 1);
        }
      } else {
        state.dateSlotOverrides.push({ date, time, status: 'blocked' });
      }
      localStorage.setItem('gc_date_slot_overrides', JSON.stringify(state.dateSlotOverrides));
      syncToCloud();
      window.dispatchEvent(new Event('storage'));
      renderApp();
    }

        syncToCloud();
        window.dispatchEvent(new Event('storage'));
        alert(`✅ ${apt.customerName} kişisinin randevusu onaylandı! Müşteriye bildirim gönderildi.`);
        renderApp();
      }
    }

    function adminRejectApt(id) {
      const apt = state.appointments.find(a => a.id === id);
      if (apt) {
        apt.status = 'rejected';
        localStorage.setItem('gc_appointments', JSON.stringify(state.appointments));

        const notif = {
          id: Date.now().toString(),
          phone: apt.customerPhone,
          title: '❌ Randevunuz İptal Edildi / Reddedildi',
          message: `EZO STİLE: ${apt.serviceName} randevunuz ${apt.date} ${apt.time} tarihi için reddedildi/iptal edildi.`,
          date: new Date().toLocaleTimeString()
        };
        state.notifications.unshift(notif);
        localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));

        syncToCloud();
        window.dispatchEvent(new Event('storage'));
        alert(`❌ ${apt.customerName} kişisinin randevusu reddedildi / iptal edildi. Müşteriye bildirim gönderildi.`);
        renderApp();
      }
    }

    function dismissNotif(notifId) {
      state.notifications = state.notifications.filter(n => n.id !== notifId);
      localStorage.setItem('gc_notifications', JSON.stringify(state.notifications));
      syncToCloud();
      renderApp();
    }

    // --- SERVICE MANAGEMENT FUNCTIONS ---
    function updateServiceField(id, field, value) {
      const svc = state.services.find(s => s.id === id);
      if (svc) {
        svc[field] = value;
      }
    }

    function addNewService() {
      const name = document.getElementById('new-svc-name').value;
      const duration = document.getElementById('new-svc-dur').value || '30 dk';
      const price = Number(document.getElementById('new-svc-price').value || 200);

      if (!name) {
        alert('Lütfen hizmet adını giriniz.');
        return;
      }

      const newSvc = {
        id: Date.now().toString(),
        name,
        duration,
        price
      };

      state.services.push(newSvc);
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      alert(`✅ "${name}" hizmeti başarıyla eklendi!`);
      renderApp();
    }

    function deleteService(id) {
      if (state.services.length <= 1) {
        alert('En az bir hizmet kalmalıdır.');
        return;
      }
      state.services = state.services.filter(s => s.id !== id);
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      renderApp();
    }

    function saveServices() {
      localStorage.setItem('gc_services', JSON.stringify(state.services));
      syncToCloud();
      alert('✅ Tüm hizmet isimleri ve fiyatlar başarıyla kaydedildi!');
      renderApp();
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });

    // Storage live sync listener
    window.addEventListener('storage', () => {
      state.weeklySchedule = JSON.parse(localStorage.getItem('gc_weekly_schedule') || JSON.stringify(state.weeklySchedule));
      state.dateSlotOverrides = JSON.parse(localStorage.getItem('gc_date_slot_overrides') || '[]');
      state.services = JSON.parse(localStorage.getItem('gc_services') || JSON.stringify(state.services));
      state.appointments = JSON.parse(localStorage.getItem('gc_appointments') || '[]');
      state.notifications = JSON.parse(localStorage.getItem('gc_notifications') || '[]');
      renderApp();
    });
  </script>
</body>
</html>
