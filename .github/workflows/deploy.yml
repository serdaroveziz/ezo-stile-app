name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Synchronize docs folder
        run: |
          mkdir -p docs
          cp -rf index.html sw.js manifest.json logo.png icon-192.png icon-512.png .nojekyll js api docs/ 2>/dev/null || true

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -B gh-pages
          git add -A
          git commit -m "deploy: Sync main HEAD to gh-pages [skip ci]" --allow-empty
          git push origin gh-pages --force
